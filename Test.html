<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidushi AI - Ultimate 70B & 2.5 Access</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="//unpkg.com/3d-force-graph"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; font-family: 'Segoe UI', sans-serif; color: white; }
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; display: none; }
        #silent-video { display: block; }
        #selfie-video { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 5; border: 3px solid #ff4500; }
        
        /* UI Elements */
        .side-btn { position: fixed; top: 20px; right: 20px; z-index: 20; background: rgba(0,0,0,0.5); color: white; border: 1px solid #ff4500; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; }
        .settings-box { background: #111; padding: 25px; border: 1px solid #ff4500; border-radius: 15px; width: 90%; max-width: 400px; }
        
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #222; color: white; border: 1px solid #444; border-radius: 5px; }
        .save-btn { width: 100%; padding: 12px; background: #ff4500; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        
        #mic-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20; text-align: center; }
        .round-btn { width: 70px; height: 70px; border-radius: 50%; border: none; color: white; font-size: 28px; cursor: pointer; margin: 0 10px; }
        #mic-btn { background: #ff4500; }
        #stop-btn { background: #333; }
        .listening { animation: pulse 1s infinite; background: red !important; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        #rag-status { display: none; position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: #008cff; padding: 5px 15px; border-radius: 20px; z-index: 100; font-size: 12px; }
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .menu-item { background: #222; padding: 10px; border-radius: 8px; text-align: center; font-size: 10px; cursor: pointer; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="rag-status">📄 RAG Active</div>

    <div id="video-container">
        <video id="silent-video" autoplay muted loop playsinline><source src="silent.mp4"></video>
        <video id="talking-video" muted loop playsinline><source src="talking.mp4"></video>
        <video id="thinking-video" muted loop playsinline><source src="thinking.mp4"></video>
    </div>

    <video id="selfie-video" autoplay playsinline></video>
    <canvas id="canvas-capture" style="display:none;"></canvas>

    <button class="side-btn" onclick="window.openSettings()"><i class="fas fa-cog"></i></button>

    <div id="settings-modal" class="modal">
        <div class="settings-box">
            <h3>વિદુષી સેટિંગ્સ</h3>
            <div class="menu-grid">
                <div class="menu-item" onclick="document.getElementById('docLoader').click()"><i class="fas fa-file-pdf"></i><br>PDF</div>
                <div class="menu-item" onclick="window.open3DVanshavali()"><i class="fas fa-tree"></i><br>3D વંશ</div>
            </div>

            <label>AI પ્રદાતા (Provider):</label>
            <select id="providerSelect" onchange="window.toggleProviderSettings()">
                <option value="gemini">Google Gemini</option>
                <option value="groq">Groq (Llama 3)</option>
            </select>

            <div id="gemini-settings">
                <label>Gemini Model:</label>
                <select id="geminiModelSelect">
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash (Special)</option>
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro (Special)</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                </select>
                <input type="password" id="geminiKeyInput" placeholder="Gemini API Key">
            </div>

            <div id="groq-settings" style="display:none;">
                <label>Groq Model:</label>
                <select id="groqModelSelect">
                    <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Best)</option>
                    <option value="llama3-70b-8192">Llama 3 70B</option>
                    <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
                </select>
                <input type="password" id="groqKeyInput" placeholder="Groq API Key (gsk_...)">
            </div>

            <input type="text" id="userNameInput" placeholder="તમારું નામ">
            <button class="save-btn" onclick="window.saveSettings()">SAVE & CLOSE</button>
        </div>
    </div>

    <div id="vanshavali-3d-modal" class="modal" style="padding:0; background:black;">
        <button onclick="window.close3DVanshavali()" style="position:fixed; top:20px; right:20px; z-index:300; background:red; color:white; border:none; padding:10px;">બંધ કરો</button>
        <div id="graph-container" style="width:100%; height:100%;"></div>
    </div>

    <input type="file" id="docLoader" style="display:none;" onchange="window.handleRAGUpload(this)">

    <div id="mic-container">
        <div id="status-text">માઈક દબાવો...</div><br>
        <button id="mic-btn" class="round-btn" onclick="window.startConversation()"><i class="fas fa-microphone"></i></button>
        <button id="stop-btn" class="round-btn" onclick="window.stopConversation()"><i class="fas fa-stop"></i></button>
    </div>

    <script type="module">
        // --- ૧. VANSHAVALI DATA (તમારા vanshavali_data.js માંથી) ---
        const vanshavaliData = {
            name: "મૂળ પુરુષ",
            info: "પરિવારના સ્થાપક",
            children: [
                {
                    name: "પુત્ર ૧",
                    info: "ગામ: રાજકોટ",
                    children: [{ name: "પૌત્ર ૧", info: "એન્જિનિયર" }]
                },
                {
                    name: "પુત્ર ૨",
                    info: "ગામ: જામનગર"
                }
            ]
        };

        // --- ૨. STATE MANAGEMENT ---
        let userName = localStorage.getItem('vidushi_username') || "સાહેબ";
        let aiProvider = localStorage.getItem('vidushi_provider') || 'gemini';
        let ragContent = "";
        let isProcessing = false;

        // --- ૩. SETTINGS & UI ---
        window.openSettings = () => {
            document.getElementById('settings-modal').style.display = 'flex';
            document.getElementById('userNameInput').value = userName;
            document.getElementById('geminiKeyInput').value = localStorage.getItem('vidushi_gemini_key') || "";
            document.getElementById('groqKeyInput').value = localStorage.getItem('vidushi_groq_key') || "";
            window.toggleProviderSettings();
        };

        window.toggleProviderSettings = () => {
            const p = document.getElementById('providerSelect').value;
            document.getElementById('gemini-settings').style.display = p === 'gemini' ? 'block' : 'none';
            document.getElementById('groq-settings').style.display = p === 'groq' ? 'block' : 'none';
        };

        window.saveSettings = () => {
            userName = document.getElementById('userNameInput').value;
            aiProvider = document.getElementById('providerSelect').value;
            localStorage.setItem('vidushi_username', userName);
            localStorage.setItem('vidushi_provider', aiProvider);
            localStorage.setItem('vidushi_gemini_key', document.getElementById('geminiKeyInput').value);
            localStorage.setItem('vidushi_groq_key', document.getElementById('groqKeyInput').value);
            localStorage.setItem('vidushi_gemini_model', document.getElementById('geminiModelSelect').value);
            localStorage.setItem('vidushi_groq_model', document.getElementById('groqModelSelect').value);
            document.getElementById('settings-modal').style.display = 'none';
            window.speak("સેટિંગ્સ સેવ થઈ ગયા છે.");
        };

        // --- ૪. AI API CALLS ---
        window.askAI = async (text) => {
            if(isProcessing) return;
            isProcessing = true;
            playVideo('thinking');
            
            const context = ragContent ? `\n[DOCUMENT CONTEXT]: ${ragContent}` : "";
            const systemPrompt = `You are Vidushi AI. User name is ${userName}. Family Data: ${JSON.stringify(vanshavaliData)}. ${context} Respond in Gujarati.`;

            if(aiProvider === 'gemini') {
                await askGemini(text, systemPrompt);
            } else {
                await askGroq(text, systemPrompt);
            }
        };

        async function askGemini(userText, system) {
            const key = localStorage.getItem('vidushi_gemini_key');
            const model = localStorage.getItem('vidushi_gemini_model') || "gemini-2.5-flash";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: system + "\nQuestion: " + userText }] }] })
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                window.speak(reply);
            } catch(e) { window.speak("Gemini API Error."); isProcessing=false; }
        }

        async function askGroq(userText, system) {
            const key = localStorage.getItem('vidushi_groq_key');
            const model = localStorage.getItem('vidushi_groq_model') || "llama-3.3-70b-versatile";
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: model,
                        messages: [{role: "system", content: system}, {role: "user", content: userText}]
                    })
                });
                const data = await response.json();
                window.speak(data.choices[0].message.content);
            } catch(e) { window.speak("Groq API Error."); isProcessing=false; }
        }

        // --- ૫. SPEECH ENGINE ---
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'gu-IN';

        window.startConversation = () => { recognition.start(); document.getElementById('mic-btn').classList.add('listening'); };
        window.stopConversation = () => { recognition.stop(); window.speechSynthesis.cancel(); playVideo('silent'); isProcessing=false; };

        recognition.onresult = (e) => {
            const text = e.results[0][0].transcript;
            document.getElementById('status-text').innerText = text;
            window.askAI(text);
            document.getElementById('mic-btn').classList.remove('listening');
        };

        window.speak = (text) => {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'gu-IN';
            u.onstart = () => playVideo('talking');
            u.onend = () => { playVideo('silent'); isProcessing = false; };
            window.speechSynthesis.speak(u);
        };

        function playVideo(id) {
            document.querySelectorAll('video').forEach(v => v.style.display = 'none');
            document.getElementById(id + '-video').style.display = 'block';
            document.getElementById(id + '-video').play();
        }

        // --- ૬. RAG & 3D ENGINE ---
        window.handleRAGUpload = async (input) => {
            const file = input.files[0];
            document.getElementById('rag-status').style.display = 'block';
            document.getElementById('rag-status').innerText = 'Reading...';
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                fullText += content.items.map(item => item.str).join(" ");
            }
            ragContent = fullText;
            document.getElementById('rag-status').innerText = '✅ PDF Loaded';
            window.speak("દસ્તાવેજ વંચાઈ ગયો છે.");
        };

        window.open3DVanshavali = () => {
            document.getElementById('vanshavali-3d-modal').style.display = 'flex';
            const nodes = [], links = [];
            function parse(node, parent = null) {
                nodes.push({ id: node.name, val: 1 });
                if(parent) links.push({ source: parent.name, target: node.name });
                if(node.children) node.children.forEach(c => parse(c, node));
            }
            parse(vanshavaliData);
            ForceGraph3D()(document.getElementById('graph-container'))
                .graphData({ nodes, links })
                .nodeLabel('id')
                .nodeAutoColorBy('id');
        };

        window.close3DVanshavali = () => { document.getElementById('vanshavali-3d-modal').style.display = 'none'; };
    </script>
</body>
</html>
