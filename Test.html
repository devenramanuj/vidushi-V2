<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidushi AI - Personalized Voice</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three-spritetext@1.8.2/dist/three-spritetext.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

    <style>
        :root { --primary: #ff4500; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; }
        .header-ui { position: fixed; top: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 100; }
        .side-btn { background: rgba(0,0,0,0.7); color: white; border: 1px solid var(--primary); width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px var(--primary); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .settings-box { background: #111; padding: 25px; border-radius: 25px; width: 100%; max-width: 450px; border: 1px solid var(--primary); max-height: 85vh; overflow-y: auto; }
        .btn-action { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 12px; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        input, select, .slider-container { width: 100%; padding: 12px; margin: 8px 0; background: #222; color: white; border: 1px solid #444; border-radius: 10px; box-sizing: border-box; }
        .slider-container label { display: block; margin-bottom: 5px; color: #bbb; font-size: 14px; }
        .slider-container input[type="range"] { -webkit-appearance: none; width: 100%; height: 8px; background: #555; outline: none; border-radius: 5px; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); cursor: pointer; }

        #main-hub { position: fixed; bottom: 50px; width: 100%; text-align: center; z-index: 50; }
        .mic-btn { width: 90px; height: 90px; border-radius: 50%; border: none; color: white; font-size: 35px; background: var(--primary); box-shadow: 0 0 30px var(--primary); cursor: pointer; }
        #status-display { margin-bottom: 20px; font-size: 18px; color: var(--primary); font-weight: 500; padding: 0 20px; }
        #canvas-hidden { display: none; }
    </style>
</head>
<body>

    <div class="header-ui">
        <div style="font-weight: bold; color: var(--primary); font-size: 20px;">VIDUSHI 2.5 PRO</div>
        <button class="side-btn" onclick="window.toggleSettings(true)"><i class="fas fa-cog"></i></button>
    </div>

    <div id="settings-modal" class="modal">
        <div class="settings-box">
            <h3>વિદુષી સિસ્ટમ (Gemini 2.5)</h3>
            <button class="btn-action" onclick="window.startSmartLens()"><i class="fas fa-eye"></i> સ્માર્ટ વિઝન લેન્સ</button>
            <button class="btn-action" style="background:#222;" onclick="window.open3DVanshavali()"><i class="fas fa-sitemap"></i> સંપૂર્ણ ૩D વંશાવલી</button>
            
            <hr style="border: 0.5px solid #333; margin: 20px 0;">
            <label>AI મોડલ સિલેક્ટ કરો:</label>
            <select id="modelSelect">
                <option value="gemini-2.5-pro">Gemini 2.5 Pro (Best for Inscriptions)</option>
                <option value="gemini-2.5-flash">Gemini 2.5 Flash (Super Fast)</option>
            </select>
            <input type="password" id="apiKeyInput" placeholder="Gemini 2.5 API Key">
            <input type="text" id="userNameInput" placeholder="તમારું નામ">
            <input type="password" id="fbApiKey" placeholder="Firebase API Key">

            <div style="margin: 20px 0; border-top: 1px solid #333; padding-top: 10px;">
                <h4 style="color:var(--primary); margin-top:5px; margin-bottom:10px;">અવાજ સેટિંગ્સ</h4>
                <div class="slider-container">
                    <label for="voicePitch">પિચ (અવાજની ઉંચાઈ):</label>
                    <input type="range" id="voicePitch" min="0.5" max="2" value="1" step="0.1">
                </div>
                <div class="slider-container">
                    <label for="voiceRate">સ્પીડ (બોલવાની ગતિ):</label>
                    <input type="range" id="voiceRate" min="0.5" max="2" value="1" step="0.1">
                </div>
            </div>

            <button class="btn-action" onclick="window.saveSettings()">સેટિંગ્સ સાચવો</button>
            <button class="btn-action" style="background:transparent; color:#666;" onclick="window.toggleSettings(false)">બંધ કરો</button>
        </div>
    </div>

    <div id="vanshavali-3d-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index:300;">
        <button style="position:fixed; top:20px; right:20px; z-index:310; background:red; color:white; border:none; padding:15px; border-radius:10px;" onclick="window.close3DVanshavali()">X</button>
        <div id="graph-container"></div>
    </div>

    <div id="main-hub">
        <div id="status-display">સિસ્ટમ રેડી...</div>
        <button class="mic-btn" onclick="window.listen()"><i class="fas fa-microphone"></i></button>
    </div>

    <canvas id="canvas-hidden"></canvas>

    <script>
        let db;
        const fbBase = {
            projectId: "devenramanuj", 
            storageBucket: "devenramanuj.appspot.com",
            messagingSenderId: "1032333036814",
            appId: "1:1032333036814:web:65622a57173e63f596825c",
            databaseURL: "https://devenramanuj-default-rtdb.firebaseio.com"
        };

        const vData = {
            name: "જગદગુરુ રામાનંદાચાર્યજી",
            children: [{
                name: "અનંતાનંદજી",
                children: [{
                    name: "ગેંડાજી",
                    children: [{
                        name: "લક્ષ્મીદાસજી",
                        children: [{
                            name: "માધવદાસજી",
                            children: [{
                                name: "ખોજીજી",
                                children: [{
                                    name: "મહેન્દ્રદાસજી (પાલડી-મારવાડ)",
                                    children: [{
                                        name: "પુરણદાસજી બાપુ (ઝીંઝર)",
                                        children: [
                                            { name: "ગંગારામજી", children: [
                                                { name: "આશારામજી", children: [{ name: "ગૌતમ (મોજીરમજી)" }, { name: "ગિરધરદાસજી" }, { name: "સીતારામજી" }] },
                                                { name: "વ્રજેશરામજી", children: [{ name: "ભગવાનદાસજી" }, { name: "તુલસીદાસજી" }] }
                                            ]},
                                            { name: "રઘુરામજી", children: [{
                                                name: "દયારામજી", children: [{ name: "કાશીરામજી" }, { name: "વશરામજી" }, { 
                                                    name: "જાનકીદાસજી",
                                                    children: [{ name: "દેવેન્દ્રભાઈ" }, { name: "મનહરલાલ" }, { name: "પ્રતાપભાઈ" }, { name: "વૈકુંઠભાઈ" }, { name: "સતીષભાઈ" }]
                                                }]
                                            }]}
                                        ]
                                    }]
                                }]
                            }]
                        }]
                    }]
                }]
            }]
        };

        window.initFirebase = () => {
            const key = localStorage.getItem('fb_api_key');
            if (key && !firebase.apps.length) {
                firebase.initializeApp({ ...fbBase, apiKey: key });
                db = firebase.database();
            }
        };

        window.open3DVanshavali = () => {
            window.toggleSettings(false);
            document.getElementById('vanshavali-3d-modal').style.display = 'block';
            const nodes = [], links = [];
            const parse = (n, p = null) => {
                nodes.push({ id: n.name });
                if(p) links.push({ source: p.name, target: n.name });
                if(n.children) n.children.forEach(c => parse(c, n));
            };
            parse(vData);
            setTimeout(() => {
                ForceGraph3D()(document.getElementById('graph-container'))
                    .graphData({ nodes, links }).backgroundColor('#000')
                    .nodeThreeObject(node => { const s = new SpriteText(node.id); s.color = '#ff4500'; s.textHeight = 6; return s; })
                    .nodeThreeObjectExtend(true);
            }, 500);
        };

        window.startSmartLens = async () => {
            window.toggleSettings(false);
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            const v = document.createElement('video');
            v.style = "position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;object-fit:cover;";
            v.srcObject = s; v.autoplay = true; document.body.appendChild(v);
            
            setTimeout(() => {
                const c = document.getElementById('canvas-hidden');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                const b64 = c.toDataURL('image/jpeg').split(',')[1];
                s.getTracks().forEach(t => t.stop()); v.remove();
                window.analyzeWithGemini25(b64);
            }, 5000);
        };

        window.analyzeWithGemini25 = async (img) => {
            const model = document.getElementById('modelSelect').value;
            window.speak("Gemini 2.5 એનાલિસિસ ચાલુ છે...");
            const p = "આ ફોટામાં જે શિલાલેખ, લિપિ કે ગણિત છે તેનું ઊંડું વિશ્લેષણ ગુજરાતીમાં કરો.";
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${localStorage.getItem('api_key')}`, {
                method: 'POST',
                body: JSON.stringify({ contents: [{ parts: [{ text: p }, { inline_data: { mime_type: "image/jpeg", data: img } }] }] })
            });
            const d = await res.json();
            const t = d.candidates[0].content.parts[0].text;
            window.speak(t);
            document.getElementById('status-display').innerText = t;
        };

        window.listen = () => {
            const r = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            r.lang = 'gu-IN';
            r.onresult = (e) => {
                const q = e.results[0][0].transcript;
                document.getElementById('status-display').innerText = q;
                window.speak("વિદુષી સમજી રહી છે: " + q);
            };
            r.start();
        };

        // --- Voice Personalization Function ---
        window.speak = (t) => {
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'gu-IN'; // ગુજરાતી ભાષા સેટ કરો
            u.pitch = parseFloat(localStorage.getItem('voice_pitch') || '1'); // પિચ સેટિંગ્સ
            u.rate = parseFloat(localStorage.getItem('voice_rate') || '1');   // સ્પીડ સેટિંગ્સ
            
            // જો તમને ચોક્કસ ગુજરાતી અવાજ જોઈતો હોય, તો અહીં લિસ્ટમાંથી પસંદ કરી શકો છો
            // speechSynthesis.getVoices() નો ઉપયોગ કરીને ઉપલબ્ધ અવાજો શોધી શકાય છે
            // ઉદાહરણ: u.voice = speechSynthesis.getVoices().find(voice => voice.name === 'Google ગુજરાતી');

            window.speechSynthesis.speak(u);
        };

        window.saveSettings = () => {
            localStorage.setItem('fb_api_key', document.getElementById('fbApiKey').value);
            localStorage.setItem('api_key', document.getElementById('apiKeyInput').value);
            localStorage.setItem('user_name', document.getElementById('userNameInput').value);
            localStorage.setItem('voice_pitch', document.getElementById('voicePitch').value); // પિચ સેવ કરો
            localStorage.setItem('voice_rate', document.getElementById('voiceRate').value);   // સ્પીડ સેવ કરો
            
            window.initFirebase(); window.toggleSettings(false);
            window.speak("સેટિંગ્સ સાચવી લીધા છે. નવા અવાજ સાથે.");
        };

        // Settings Modal UI
        window.toggleSettings = (s) => {
            document.getElementById('settings-modal').style.display = s ? 'flex' : 'none';
            if (s) { // સેટિંગ્સ મોડલ ખુલે ત્યારે વેલ્યુ લોડ કરો
                document.getElementById('fbApiKey').value = localStorage.getItem('fb_api_key') || '';
                document.getElementById('apiKeyInput').value = localStorage.getItem('api_key') || '';
                document.getElementById('userNameInput').value = localStorage.getItem('user_name') || '';
                document.getElementById('voicePitch').value = localStorage.getItem('voice_pitch') || '1';
                document.getElementById('voiceRate').value = localStorage.getItem('voice_rate') || '1';
            }
        };
        window.close3DVanshavali = () => document.getElementById('vanshavali-3d-modal').style.display = 'none';

        window.onload = window.initFirebase;
    </script>
</body>
</html>
