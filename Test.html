    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, arrayUnion, collection, addDoc, deleteDoc, query, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Firebase Setup
        const firebaseConfig = {
            apiKey: localStorage.getItem('vidushi_firebase_apiKey') || "AIzaSyAexampleKey",
            authDomain: "vidushi-ai-614cb.firebaseapp.com",
            projectId: "vidushi-ai-614cb",
            storageBucket: "vidushi-ai-614cb.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let userName = localStorage.getItem('vidushi_username') || "સાહેબ";
        let geminiKeys = localStorage.getItem('vidushi_gemini_key') || "";
        let contacts = [], notes = [], expenses = [], ragContent = "";

        // Data Synchronization
        onSnapshot(query(collection(db, "vidushi_contacts"), orderBy("name")), (s) => { contacts = s.docs.map(d => ({id: d.id, ...d.data()})); renderContacts(); });
        onSnapshot(query(collection(db, "vidushi_notes"), orderBy("timestamp", "desc")), (s) => { notes = s.docs.map(d => ({id: d.id, ...d.data()})); renderNotes(); });
        onSnapshot(query(collection(db, "vidushi_expenses"), orderBy("timestamp", "desc")), (s) => { expenses = s.docs.map(d => ({id: d.id, ...d.data()})); renderExpenses(); });

        // ✅ મજબૂત કોન્ટેક્ટ સર્ચ લોજિક (સુધારો)
        window.findContact = (text) => {
            let input = text.toLowerCase();
            let found = null;
            let maxMatch = 0;
            contacts.forEach(c => {
                let dbName = c.name.toLowerCase();
                // જો આખું નામ વાક્યમાં ક્યાંય પણ હોય (દા.ત. "નરેશભાઈને કોલ કર" માં "નરેશભાઈ" છે)
                if (input.includes(dbName)) {
                    if (dbName.length > maxMatch) {
                        maxMatch = dbName.length;
                        found = c;
                    }
                }
            });
            return found;
        };

        // ✅ સુધારેલા કોલ અને મેસેજ ફંક્શન્સ
        window.makeCall = (text) => {
            let c = window.findContact(text);
            if(c) {
                window.speak(`${c.name} ને કોલ જોડું છું`);
                setTimeout(() => window.open(`tel:${c.number}`, '_self'), 1500);
            } else {
                window.speak("ક્ષમા કરશો આ નામ સંપર્કમાં નથી");
            }
        };

        window.sendMessage = (text) => {
            let c = window.findContact(text);
            if(c) {
                window.speak(`${c.name} માટે વોટ્સએપ ખોલું છું`);
                setTimeout(() => window.open(`https://wa.me/91${c.number}`, '_blank'), 1500);
            } else {
                window.speak("ક્ષમા કરશો આ નામ સંપર્કમાં નથી");
            }
        };

        // Command Processing
        window.processCommand = async (text) => {
            let cmd = text.toLowerCase();
            
            if(cmd.includes("કોલ") || cmd.includes("ફોન") || cmd.includes("call")) { window.makeCall(text); return; }
            if(cmd.includes("મેસેજ") || cmd.includes("whatsapp")) { window.sendMessage(text); return; }
            
            if(cmd.includes("નોંધ")) { 
                await addDoc(collection(db, "vidushi_notes"), { text: text.replace("નોંધ",""), timestamp: Date.now() }); 
                window.speak("મેં ડાયરીમાં નોંધી લીધું છે"); return; 
            }
            
            if(cmd.includes("હિસાબ")) { 
                let amt = text.match(/\d+/); 
                if(amt) { 
                    await addDoc(collection(db, "vidushi_expenses"), { amount: parseInt(amt[0]), desc: text, timestamp: Date.now() }); 
                    window.speak(`${amt[0]} રૂપિયા હિસાબમાં લખી લીધા છે`); return; 
                } 
            }

            if(cmd.includes("ચિત્ર") || cmd.includes("બનાવ")) {
                window.speak("તમારા માટે ચિત્ર બનાવી રહી છું");
                const overlay = document.createElement('div');
                overlay.id = 'image-overlay';
                overlay.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:500; display:flex; flex-direction:column; align-items:center; justify-content:center;";
                overlay.innerHTML = `<img src="https://pollinations.ai/p/${encodeURIComponent(text)}?width=1024&height=1024" style="max-width:90%; border:2px solid orange;">
                                     <button onclick="this.parentElement.remove()" style="margin-top:20px; padding:10px 20px; background:red; color:white; border:none; border-radius:5px;">બંધ કરો</button>`;
                document.body.appendChild(overlay);
                return;
            }

            if(cmd.includes("વંશાવલી")) { window.open3DVanshavali(); return; }

            askGemini(text);
        };

        // Gemini AI Text logic
        async function askGemini(text) {
            const keys = geminiKeys.split(',').filter(k => k.trim());
            if(!keys.length) { window.speak("સેટિંગ્સમાં API Key નાખો"); return; }
            playVideo('thinking');
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${keys[0]}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `તમે વિદુષી એઆઈ છો જેને દેવેન્દ્રભાઈએ બનાવી છે. સનાતન ધર્મ વિશે વિગતવાર અને અન્ય પ્રશ્નોના ટૂંકા જવાબ આપો. કોઈ પણ ચિહ્નો (.,!) વગર ગુજરાતીમાં બોલો. પ્રશ્ન: ${text} RAG Context: ${ragContent}` }] }] })
                });
                const data = await res.json();
                let reply = data.candidates[0].content.parts[0].text;
                
                // Gen UI Check
                if(reply.includes(":::APP_START:::")) {
                    let code = reply.split(":::APP_START:::")[1].split(":::APP_END:::")[0];
                    document.getElementById('app-viewer-modal').style.display = 'flex';
                    document.getElementById('app-render-area').innerHTML = code;
                } else {
                    window.speak(reply);
                }
            } catch (e) { window.speak("નેટવર્ક એરર આવી છે"); }
        }

        // Voice Output
        window.speak = (text) => {
            window.speechSynthesis.cancel();
            const clean = text.replace(/[.,!*#]/g, "");
            const u = new SpeechSynthesisUtterance(clean);
            u.lang = 'gu-IN';
            u.onstart = () => playVideo('talking');
            u.onend = () => playVideo('smiling');
            window.speechSynthesis.speak(u);
        };

        // Video Control
        function playVideo(id) {
            document.querySelectorAll('video').forEach(v => { v.style.display = 'none'; v.pause(); });
            const v = document.getElementById(id + '-video') || document.getElementById('silent-video');
            v.style.display = 'block'; v.play();
        }

        // Feature Modals
        window.toggleModal = (id) => {
            const m = document.getElementById(id + '-modal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        };

        window.renderContacts = () => { document.getElementById('contacts-list').innerHTML = contacts.map(c => `<div class="list-item"><span><b>${c.name}</b></span><span>${c.number}</span></div>`).join(''); };
        window.renderNotes = () => { document.getElementById('notes-list').innerHTML = notes.map(n => `<div class="list-item">${n.text}</div>`).join(''); };
        window.renderExpenses = () => { document.getElementById('expense-list').innerHTML = expenses.map(e => `<div class="list-item"><span>₹${e.amount}</span><span>${e.desc || ""}</span></div>`).join(''); };

        // Vanshavali Logic
        window.open3DVanshavali = () => {
            document.getElementById('vanshavali-3d-modal').style.display = 'block';
            const container = document.getElementById('tree-container');
            container.innerHTML = '';
            container.appendChild(createVNode(window.vanshavaliData));
        };
        window.close3DVanshavali = () => document.getElementById('vanshavali-3d-modal').style.display = 'none';

        function createVNode(node) {
            const d = document.createElement('div');
            const r = document.createElement('div');
            r.className = 'vanshavali-row';
            r.innerHTML = `<span style="color:gold; margin-right:10px;">➔</span> ${node.name} ${node.info ? `(${node.info})` : ''}`;
            d.appendChild(r);
            if(node.children) {
                const c = document.createElement('div');
                c.className = 'children-container';
                node.children.forEach(child => c.appendChild(createVNode(child)));
                r.onclick = (e) => { e.stopPropagation(); c.style.display = (c.style.display === 'block') ? 'none' : 'block'; };
                d.appendChild(c);
            }
            return d;
        }

        // Smart Lens Logic
        window.captureAndAnalyze = async () => {
            window.speak("કેમેરો શરૂ કરું છું");
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            const video = document.getElementById('selfie-video');
            video.srcObject = stream;
            video.style.display = 'block';
            
            setTimeout(() => {
                const canvas = document.getElementById('canvas-capture');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const b64 = canvas.toDataURL('image/jpeg').split(',')[1];
                stream.getTracks().forEach(t => t.stop());
                video.style.display = 'none';
                window.speak("ફોટો વિશ્લેષણ કરી રહી છું");
                // Here you would call askGeminiVision similarly
            }, 3000);
        };

        // Recognition Setup
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'gu-IN';
        recognition.onstart = () => { document.getElementById('mic-btn').classList.add('listening'); document.getElementById('status-text').innerText = "સાંભળું છું..."; };
        recognition.onend = () => { document.getElementById('mic-btn').classList.remove('listening'); };
        recognition.onresult = (e) => window.processCommand(e.results[0][0].transcript);

        window.startConversation = () => recognition.start();
        window.stopConversation = () => { recognition.stop(); window.speechSynthesis.cancel(); playVideo('silent'); };

        window.addContactUI = async () => {
            const n = document.getElementById('contactName').value;
            const num = document.getElementById('contactNumber').value;
            if(n && num) { await addDoc(collection(db, "vidushi_contacts"), { name: n, number: num }); window.speak("સંપર્ક ઉમેરાઈ ગયો છે"); }
        };

        window.saveSettings = () => {
            userName = document.getElementById('userNameInput').value;
            geminiKeys = document.getElementById('geminiKeyInput').value;
            localStorage.setItem('vidushi_username', userName);
            localStorage.setItem('vidushi_gemini_key', geminiKeys);
            document.getElementById('settings-modal').style.display = 'none';
            window.speak("સેટિંગ્સ સેવ થઈ ગયા છે");
        };

        window.openSettings = () => {
            document.getElementById('settings-modal').style.display = 'flex';
            document.getElementById('userNameInput').value = userName;
            document.getElementById('geminiKeyInput').value = geminiKeys;
        };

        window.onload = () => setTimeout(() => window.speak("Jay Shri Krishna " + userName), 1000);
    </script>
</body>
</html>
