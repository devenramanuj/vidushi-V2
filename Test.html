<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidushi-AI | Master Build 2026</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://unpkg.com/3d-force-graph"></script>
    <script src="vanshavali_data.js"></script>

    <style>
        :root { --p: #ff4500; --b: #000; }
        body, html { margin: 0; padding: 0; background: var(--b); color: white; font-family: 'Segoe UI', sans-serif; height: 100%; overflow: hidden; }
        #home-page { height: 100vh; width: 100vw; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        #vidushi-video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        .top-nav { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .mic-container { position: fixed; bottom: 40px; left: 0; width: 100%; z-index: 1000; text-align: center; pointer-events: none; }
        .mic-btn { width: 85px; height: 85px; border-radius: 50%; background: var(--p); border: 4px solid white; color: white; font-size: 32px; cursor: pointer; box-shadow: 0 0 35px var(--p); display: inline-flex; align-items: center; justify-content: center; pointer-events: auto; }
        #status-text { background: rgba(0,0,0,0.8); color: white; padding: 8px 20px; border-radius: 25px; display: inline-block; margin-bottom: 15px; font-weight: bold; border: 1px solid var(--p); pointer-events: auto; }
        #settings-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 2000; display: none; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: #111; border: 1px solid #333; padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; }
        .card i { color: var(--p); font-size: 26px; margin-bottom: 8px; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 10px; font-size: 16px; }
        .close-btn { background: red; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #graph-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 3000; display: none; }
    </style>
</head>
<body id="main-body">

    <div id="home-page" onclick="welcomeUser()">
        <video id="vidushi-video" autoplay loop muted playsinline><source id="v-src" src="smiling.mp4" type="video/mp4"></video>
        <div class="top-nav">
            <button class="mic-btn" style="width:50px; height:50px; font-size:20px;" onclick="event.stopPropagation(); toggleSettings();"><i class="fas fa-cog"></i></button>
        </div>
        <div class="mic-container">
            <div id="status-text">નમસ્તે, હું વિદુષી છું</div><br>
            <button class="mic-btn" onclick="event.stopPropagation(); startVoice();"><i class="fas fa-microphone"></i></button>
        </div>
    </div>

    <div id="graph-container">
        <button class="close-btn" style="position:fixed; top:20px; right:20px; z-index:3100;" onclick="document.getElementById('graph-container').style.display='none'">બંધ કરો</button>
        <div id="3d-graph"></div>
    </div>

    <div id="settings-page">
        <button class="close-btn" style="float: right;" onclick="toggleSettings()">X</button>
        <h2 style="color:var(--p);">Vidushi-AI Features</h2>
        <input type="password" id="apiKey" placeholder="Gemini API Key">
        <button onclick="saveKey()" style="width:100%; background:var(--p); color:white; padding:15px; border:none; border-radius:10px; font-weight:bold;">સેવ કરો</button>

        <div class="menu-grid">
            <div class="card" onclick="startLens()"><i class="fas fa-camera"></i><br>૧. સ્માર્ટ લેન્સ</div>
            <div class="card" onclick="show3DTree()"><i class="fas fa-sitemap"></i><br>૨. ૩D વંશાવલી</div>
            <div class="card" onclick="diaryAction('write')"><i class="fas fa-pen-nib"></i><br>૩. ડાયરી લખો</div>
            <div class="card" onclick="diaryAction('read')"><i class="fas fa-book"></i><br>૪. ડાયરી વાંચો</div>
            <div class="card" onclick="photoAction('save')"><i class="fas fa-user-plus"></i><br>૫. ફોટો સેવ</div>
            <div class="card" onclick="photoAction('find')"><i class="fas fa-search"></i><br>૬. ફોટો શોધો</div>
            <div class="card" onclick="startVoice('math')"><i class="fas fa-calculator"></i><br>૭. ગણિત</div>
            <div class="card" onclick="askGemini('આજના સમાચાર જણાવો')"><i class="fas fa-newspaper"></i><br>૮. સમાચાર</div>
            <div class="card" onclick="askGemini('એક સારો સુવિચાર કહો')"><i class="fas fa-lightbulb"></i><br>૯. સુવિચાર</div>
            <div class="card" onclick="askGemini('એક જોક્સ સંભળાવો')"><i class="fas fa-laugh-beam"></i><br>૧૦. મનોરંજન</div>
            <div class="card" onclick="speak('સિસ્ટમ સુરક્ષિત છે.')"><i class="fas fa-shield-alt"></i><br>૧૧. સિક્યુરિટી</div>
            <div class="card" onclick="location.reload()"><i class="fas fa-sync-alt"></i><br>૧૨. રીસેટ એપ</div>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let welcomed = false;
        const contacts = { "શ્યામ": "8200026682", "નીતા": "9227804906", "નીતાબેન": "9227804906" };

        function changeEmotion(emo) {
            const v = document.getElementById('vidushi-video');
            const s = document.getElementById('v-src');
            if(!s.src.includes(emo + ".mp4")) { s.src = emo + ".mp4"; v.load(); v.play(); }
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'gu-IN';
            utter.onstart = () => changeEmotion('talking');
            utter.onend = () => changeEmotion('smiling');
            window.speechSynthesis.speak(utter);
        }

        function welcomeUser() {
            if (!welcomed) {
                speak("જય શ્રી કૃષ્ણ! હું વિદુષી છું. મને દેવેન્દ્રભાઈએ બનાવી છે. હું આપની શું મદદ કરી શકું?");
                welcomed = true;
            }
        }

        function toggleSettings() {
            const p = document.getElementById('settings-page');
            p.style.display = (p.style.display === 'block') ? 'none' : 'block';
        }

        function saveKey() { localStorage.setItem('v_key', document.getElementById('apiKey').value); alert("Saved!"); }

        function handleCommand(q) {
            q = q.toLowerCase();
            // 🟢 WhatsApp & Call Logic
            if (q.includes("મેસેજ") || q.includes("whatsapp")) {
                let target = q.includes("નીતા") ? "9227804906" : (q.includes("શ્યામ") ? "8200026682" : null);
                if (target) {
                    let msg = q.split("કે")[1] || "કેમ છો?";
                    window.open(`https://wa.me/91${target}?text=${encodeURIComponent(msg)}`, '_blank');
                    speak("મેસેજ મોકલી રહી છું."); return;
                }
            }
            if (q.includes("ફોન") || q.includes("કોલ")) {
                let target = q.includes("નીતા") ? "9227804906" : (q.includes("શ્યામ") ? "8200026682" : null);
                if (target) { window.location.href = `tel:${target}`; return; }
            }
            askGemini(q);
        }

        async function askGemini(query, imageBase64 = null) {
            const key = localStorage.getItem('v_key');
            if(!key) return speak("એપીઆઈ કી નાખો.");
            changeEmotion('thinking');
            let payload = imageBase64 ? 
                { contents: [{ parts: [{ text: "Explain this in Gujarati." }, { inline_data: { mime_type: "image/jpeg", data: imageBase64 } }] }] } :
                { contents: [{ parts: [{ text: "તમે વિદુષી-AI છો. દેવેન્દ્રભાઈ તમારા માલિક છે. ગુજરાતીમાં જવાબ આપો: " + query }] }] };
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
                });
                const data = await res.json();
                const txt = data.candidates[0].content.parts[0].text;
                document.getElementById('status-text').innerText = txt;
                speak(txt);
            } catch (err) { speak("ભૂલ આવી છે."); changeEmotion('smiling'); }
        }

        function startVoice(mode = '') {
            welcomeUser();
            const rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
            rec.lang = 'gu-IN';
            rec.onstart = () => { document.getElementById('status-text').innerText = "સાંભળી રહી છું..."; };
            rec.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                document.getElementById('status-text').innerText = transcript;
                if(mode === 'diary') saveDiary(transcript);
                else if(mode === 'math') askGemini("ગણિત ઉકેલો: " + transcript);
                else handleCommand(transcript);
            };
            rec.start();
        }

        function show3DTree() {
            if (!window.vanshavaliData) return alert("Data file missing!");
            document.getElementById('graph-container').style.display = 'block';
            const nodes = [], links = [];
            const build = (n, p = null) => {
                nodes.push({ id: n.name, info: n.info || "" });
                if(p) links.push({ source: p.name, target: n.name });
                if(n.children) n.children.forEach(c => build(c, n));
            };
            build(window.vanshavaliData);
            ForceGraph3D()(document.getElementById('3d-graph')).graphData({ nodes, links }).nodeColor(() => '#ff4500').onNodeClick(node => speak(node.id + ". " + node.info));
        }

        function diaryAction(m) {
            if(m === 'write') { speak("ડાયરીમાં શું લખવું છે?"); setTimeout(() => startVoice('diary'), 2000); }
            else { alert(localStorage.getItem('v_diary') || "ખાલી છે."); }
        }
        function saveDiary(t) {
            let d = localStorage.getItem('v_diary') || "";
            d += `\n[${new Date().toLocaleString()}]: ${t}`;
            localStorage.setItem('v_diary', d); speak("સેવ થઈ ગયું.");
        }

        async function startLens() {
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            const v = document.createElement('video'); v.srcObject = s; v.play(); toggleSettings();
            setTimeout(() => {
                const c = document.getElementById('canvas'); c.width = 640; c.height = 480;
                c.getContext('2d').drawImage(v, 0, 0, 640, 480);
                const b64 = c.toDataURL('image/jpeg').split(',')[1];
                s.getTracks().forEach(t => t.stop()); askGemini(null, b64);
            }, 3000);
        }

        async function photoAction(mode) {
            if(mode === 'save') {
                const n = prompt("નામ?"); if(!n) return;
                const s = await navigator.mediaDevices.getUserMedia({ video: true });
                const v = document.createElement('video'); v.srcObject = s; v.play();
                setTimeout(() => {
                    const c = document.getElementById('canvas'); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
                    let ph = JSON.parse(localStorage.getItem('v_photos') || "{}");
                    ph[n.toLowerCase()] = c.toDataURL('image/jpeg');
                    localStorage.setItem('v_photos', JSON.stringify(ph));
                    s.getTracks().forEach(t => t.stop()); speak("ફોટો સેવ થયો.");
                }, 2000);
            } else {
                const n = prompt("નામ?"); const ph = JSON.parse(localStorage.getItem('v_photos') || "{}");
                if(ph[n.toLowerCase()]) {
                    const img = new Image(); img.src = ph[n.toLowerCase()];
                    img.style = "position:fixed; top:15%; left:5%; width:90%; z-index:4000; border:3px solid orange; border-radius:15px;";
                    img.onclick = () => img.remove(); document.body.appendChild(img);
                } else { speak("ફોટો મળ્યો નથી."); }
            }
        }
    </script>
</body>
</html>
