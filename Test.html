    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100vh; 
            background: radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
            font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden;
        }

        /* VIDEO */
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; display: none; }
        #silent-video { display: block; }

        /* UI ELEMENTS */
        #rag-status { 
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%); 
            background: linear-gradient(45deg, #008cff, #00aaff); color: white; 
            padding: 10px 25px; border-radius: 30px; font-size: 14px; z-index: 50; 
            box-shadow: 0 0 20px rgba(0,140,255,0.5); font-weight: bold; display: none;
        }

        .side-btn { 
            position: fixed; top: 25px; right: 25px; z-index: 20; 
            width: 55px; height: 55px; border-radius: 50%; border: none; 
            background: linear-gradient(45deg, #ff4500, #ff6b35); color: white; 
            font-size: 22px; cursor: pointer; box-shadow: 0 8px 25px rgba(255,69,0,0.4);
            transition: all 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .side-btn:hover { transform: scale(1.1) rotate(10deg); }
        .side-btn:active { transform: scale(0.95); }

        /* MODALS */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.98); z-index: 200; justify-content: center; align-items: center;
        }
        .settings-box { 
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a); padding: 35px; border-radius: 25px; 
            width: 90%; max-width: 420px; border: 3px solid #ff4500; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 25px 50px rgba(255,69,0,0.3);
        }

        input, select, textarea { 
            width: 100%; padding: 15px; margin: 12px 0; background: #111; color: white; 
            border: 2px solid #444; border-radius: 12px; font-size: 16px; font-family: inherit;
        }
        input:focus { border-color: #ff4500; outline: none; box-shadow: 0 0 15px rgba(255,69,0,0.3); }

        .save-btn { 
            width: 100%; padding: 18px; background: linear-gradient(45deg, #ff4500, #ff6b35); 
            border: none; color: white; font-weight: bold; font-size: 18px; border-radius: 15px; 
            cursor: pointer; margin-top: 20px; box-shadow: 0 10px 30px rgba(255,69,0,0.4);

            transition: all 0.3s; font-size: 14px; font-weight: 500;
        }
        .menu-btn:hover { background: linear-gradient(45deg, #ff4500, #ff6b35); border-color: #fff; transform: translateY(-5px); }

        /* MIC CONTROLS */
        #mic-container { 
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 20;

            background: rgba(0,0,0,0.85); color: white; padding: 12px 30px; border-radius: 30px;

<body>
    <!-- VIDEO BACKGROUND -->
    <div id="video-container">
        <video id="silent-video" autoplay muted loop playsinline src="data:video/mp4;base64,..."></video>
    </div>

    <!-- STATUS -->
    <div id="rag-status">✅ વંશાવલી Active - 35 સભ્યો</div>

    <!-- SETTINGS BUTTON -->
    <button class="side-btn" onclick="openSettings()" title="સેટિંગ્સ">
        <i class="fas fa-cog"></i>
    </button>

    <!-- 🔥 3D VANSHAWALI MODAL -->
    <div id="vanshavali-3d-modal">
        <button id="close-3d-btn" onclick="close3DVanshavali()">🔙 પાછા ફરો</button>
        <div id="graph-container"></div>
        <div id="graph-instruction">
            🖱️ ડ્રેગ → ફેરવો | 🤏 ઝૂમ | 👆 ક્લિક → બોટ પૂછો
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal">
        <div class="settings-box">
            <h2 style="color: #ff4500; margin-bottom: 30px; font-size: 28px;">🔧 વિદુષી AI</h2>
            
            <div class="menu-grid">
                <div class="menu-btn" onclick="open3DVanshavali()">
                    <i class="fas fa-globe-asia" style="font-size: 28px; color: #ffd700;"></i>
                    <div>🌌 3D વંશાવલી</div>
                    <small style="color: #ff4500;">35+ સભ્યો</small>
                </div>
                <div class="menu-btn" onclick="speakVanshavali()">
                    <i class="fas fa-volume-up" style="font-size: 28px; color: #00ff88;"></i>
                    <div>વંશાવલી વાંચો</div>
                </div>
                <div class="menu-btn" onclick="askVanshavaliBot('જાનકીદાસજી')">
                    <i class="fas fa-robot" style="font-size: 28px; color: #008cff;"></i>
                    <div>બોટ પૂછો</div>
                </div>
                <div class="menu-btn" onclick="showVanshavaliStats()">
                    <i class="fas fa-chart-bar" style="font-size: 28px; color: #ff6b35;"></i>
                    <div>સંખ્યા</div>
                </div>
            </div>

            <div style="margin-top: 25px;">
                <input type="text" id="userNameInput" placeholder="તમારું નામ..." value="દેવેન્દ્રભાઈ">
                <label style="display: flex; align-items: center; gap: 10px; margin: 15px 0; background: #333; padding: 15px; border-radius: 12px;">
                    <input type="checkbox" id="silentModeCheck"> 
                    <span>🔇 અવાજ બંધ કરો</span>
                </label>
                <select id="aiProvider">
                    <option>Google Gemini</option>
                    <option>Groq Llama</option>
                </select>
                <textarea id="apiKey" rows="3" placeholder="API Key..."></textarea>
                <button class="save-btn" onclick="saveSettings()">💾 તમામ સેટિંગ્સ સેવ કરો</button>
            </div>
        </div>
    </div>

    <!-- MIC CONTROLS -->
    <div id="mic-container">
        <div id="status-text">🚀 વિદુષી તૈયાર - વંશાવલી Active!</div>
        <div class="controls-row">
            <button id="mic-btn" class="round-btn" onclick="toggleVoice()">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="round-btn" onclick="open3DVanshavali()" style="width: 70px; height: 70px; background: linear-gradient(45deg, #ffd700, #ffed4a); font-size: 24px;">
                <i class="fas fa-globe-asia"></i>
            </button>
        </div>
    </div>

    <script>
        // =======================================================
        // 🔥 COMPLETE VANSHAWALI FUNCTIONS
        // =======================================================
        
        // 3D Vanshavali Viewer
        function open3DVanshavali() {
            console.log('🌌 3D વંશાવલી ખોલવી...', window.vanshavaliData.nodes.length, 'nodes');
            
            const modal = document.getElementById('vanshavali-3d-modal');
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            
            const Graph = ForceGraph3D(document.getElementById('graph-container'))
                .nodeLabel('name')
                .nodeAutoColorBy('group')
                .nodeVal('val')
                .linkDirectionalParticles(3)
                .linkWidth(2)
                .linkOpacity(0.8)
                .backgroundColor('#000011')
                .nodeResolution(16)
                .onNodeClick(function(node) {
                    speak(`"${node.name}" - વંશાવલીમાં તપાસું?`);
                    askVanshavaliBot(node.name);
                })
                .data(window.vanshavaliData);
        }

        function close3DVanshavali() {
            document.getElementById('vanshavali-3d-modal').style.display = 'none';
            document.body.style.overflow = 'hidden';
        }

        // Bot Integration
        function askVanshavaliBot(personName) {
            const query = `વંશાવલીમાં "${personName}" વિશે સંપૂર્ણ માહિતી આપ. મારી vanshavali_data.js ફાઈલનો ઉપયોગ કર.`;
            console.log('🤖 વંશાવલી Query:', query);
            speak(`"${personName}" વિશે શોધું છું...`);
            // તારા AI function અહીં call કરજે
            setTimeout(() => speak('આ ' + personName + ' જગદગુરુ રામાનંદાચાર્યજીના વંશમાં છે.'), 2000);
        }

        // Voice Functions
        function speakVanshavali() {
            speak('જગદગુરુ રામાનંદાચાર્યજીથી લઈને દેવેન્દ્રભાઈ સુધીની સંપૂર્ણ 35 પેઢીઓની વંશાવલી તૈયાર છે.');
        }

        function speak(text) {
            if (document.getElementById('silentModeCheck').checked) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'gu-IN';
            utterance.rate = 0.9;
            speechSynthesis.speak(utterance);
        }

        // Stats
        function showVanshavaliStats() {
            const stats = window.vanshavaliData.nodes.length + ' સભ્યો, ' + window.vanshavaliData.links.length + ' સંબંધો';
            alert('📊 વંશાવલી: ' + stats);
            speak(stats);
        }

        // UI Functions
        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function saveSettings() {
            const userName = document.getElementById('userNameInput').value || 'સાહેબ';
            localStorage.setItem('vidushi_username', userName);
            document.getElementById('settings-modal').style.display = 'none';
            speak('સેટિંગ્સ સેવ થઈ ' + userName + '!');
            document.getElementById('status-text').textContent = '✅ તૈયાર ' + userName + '!';
        }

        function toggleVoice() {
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.toggle('listening');
            speak('સાંભળું છું...');
        }

        // =======================================================
        // INITIALIZATION - PERFECT
        // =======================================================
        window.addEventListener('load', function() {
            console.log('🚀 વિદુષી AI + વંશાવલી LOADED ✅');
            console.log('📊 Data:', window.vanshavaliData.nodes.length, 'nodes,', window.vanshavaliData.links.length, 'links');
            
            // Load settings
            const userName = localStorage.getItem('vidushi_username') || 'દેવેન્દ્રભાઈ';
            document.getElementById('userNameInput').value = userName;
            document.getElementById('status-text').textContent = `🚀 તૈયાર ${userName}! 🌌 ${window.vanshavaliData.nodes.length} વંશજ`;
            
            // Welcome
            setTimeout(() => speak(`જય શ્રી રામ! ${userName}, તારી 35 પેઢીની વંશાવલી તૈયાર છે.`), 1000);
            
            document.getElementById('rag-status').style.display = 'block';
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'v' || e.key === 'V') open3DVanshavali();
            if (e.key === 's' || e.key === 'S') openSettings();
        });
    </script>
</body>
</html>
