<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ વિદુષી AI - તમામ Functions + 3D વંશાવલી</title>
    <link rel="manifest" href="data:text/plain,{}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIXED 3D Library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
    <script src="https://unpkg.com/3d-force-graph@1.79.0"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100vh; background: #000; 
            font-family: 'Segoe UI', Tahoma, sans-serif; color: white; overflow: hidden;
        }
        
        /* VIDEO */
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; display: none; }
        #silent-video { display: block; }
        
        #selfie-video { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; border: 4px solid #ff4500; }
        
        /* STATUS */
        #rag-status { 
            display: none; position: fixed; top: 15px; left: 50%; transform: translateX(-50%); 
            background: linear-gradient(45deg, #008cff, #00aaff); color: white; padding: 10px 25px; 
            border-radius: 30px; font-size: 14px; z-index: 50; box-shadow: 0 0 20px rgba(0,140,255,0.5);
        }
        
        /* SIDE BUTTON */
        .side-btn { 
            position: fixed; top: 25px; right: 25px; z-index: 20; width: 55px; height: 55px; 
            border-radius: 50%; background: linear-gradient(45deg, #ff4500, #ff6b35); color: white; 
            border: none; font-size: 22px; cursor: pointer; box-shadow: 0 8px 25px rgba(255,69,0,0.4);
            transition: all 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .side-btn:hover { transform: scale(1.1); }
        
        /* MODALS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.98); z-index: 200; justify-content: center; align-items: center; }
        .settings-box { 
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a); padding: 35px; border-radius: 25px; 
            width: 90%; max-width: 450px; border: 3px solid #ff4500; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 30px 60px rgba(255,69,0,0.3);
        }
        
        input, select, textarea { 
            width: 100%; padding: 15px; margin: 12px 0; background: #111; color: white; 
            border: 2px solid #444; border-radius: 12px; font-size: 16px;
        }
        .save-btn { 
            width: 100%; padding: 18px; background: linear-gradient(45deg, #ff4500, #ff6b35); 
            border: none; color: white; font-weight: bold; border-radius: 15px; font-size: 18px; cursor: pointer;
        }
        
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 25px 0; }
        .menu-btn { 
            background: linear-gradient(145deg, #333, #444); border: 2px solid #555; color: white; 
            padding: 25px 15px; border-radius: 18px; cursor: pointer; text-align: center; transition: all 0.3s;
            font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .menu-btn:hover { background: linear-gradient(45deg, #ff4500, #ff6b35); transform: translateY(-5px); }
        
        /* MIC */
        #mic-container { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 20; text-align: center; }
        #status-text { background: rgba(0,0,0,0.9); color: white; padding: 15px 35px; border-radius: 35px; 
            font-size: 16px; margin-bottom: 25px; backdrop-filter: blur(20px); border: 2px solid #ff4500; }
        .round-btn { width: 85px; height: 85px; border-radius: 50%; border: none; color: white; 
            font-size: 35px; cursor: pointer; margin: 0 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        #mic-btn { background: linear-gradient(45deg, #ff4500, #ff6b35); border: 4px solid rgba(255,255,255,0.3); }
        .listening { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.1);} }
        
        /* 3D MODAL - FIXED */
        #vanshavali-3d-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 300; }
        #graph-container { width: 100%; height: 100%; }
        #close-3d-btn { position: fixed; top: 30px; right: 30px; background: #ff4444; color: white; 
            border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer; z-index: 301; }
        #graph-instruction { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            color: white; background: rgba(0,0,0,0.9); padding: 15px 30px; border-radius: 25px; font-size: 15px; z-index: 301; }
    </style>
</head>

    <!-- VIDEO -->

    <!-- SETTINGS MODAL - ALL FEATURES -->
    <div id="settings-modal" class="modal">
        <div class="settings-box">
            <h2 style="color:#ff4500; margin-bottom:30px;">🔧 વિદુષી AI કંટ્રોલ</h2>
            
            <div class="menu-grid">
                <div class="menu-btn" onclick="openVanshavali()">
                    <i class="fas fa-globe" style="font-size:28px;color:#ffd700"></i>
                    <strong>3D વંશાવલી</strong>
                    <small>35+ સભ્યો</small>
                </div>
                <div class="menu-btn" onclick="toggleNotes()">
                    <i class="fas fa-book" style="font-size:28px;color:orange"></i>
                    <strong>નોট્સ</strong>
                </div>
                <div class="menu-btn" onclick="toggleMusic()">
                    <i class="fas fa-music" style="font-size:28px;color:#00e5ff"></i>
                    <strong>ભજન</strong>
                </div>
                <div class="menu-btn" onclick="toggleExpense()">
                    <i class="fas fa-rupee-sign" style="font-size:28px;color:#00ff00"></i>
                    <strong>હિસાબ</strong>
                </div>
                <div class="menu-btn" onclick="smartLens()">
                    <i class="fas fa-eye" style="font-size:28px;color:#d4af37"></i>
                    <strong>Smart Lens</strong>
                </div>
                <div class="menu-btn" onclick="showVanshavaliStats()">
                    <i class="fas fa-chart-line" style="font-size:28px;color:#ff6b35"></i>
                    <strong>વંશાવલી Stats</strong>
                </div>
            </div>

            <!-- SETTINGS -->
            <div style="margin-top:30px;">
                <input type="text" id="userName" placeholder="તમારું નામ" value="દેવેન્દ્રભાઈ">
                <label style="display:flex;align-items:center;gap:10px;background:#333;padding:15px;border-radius:12px;margin:15px 0;">
                    <input type="checkbox" id="silentMode"> 🔇 Silent Mode
                </label>
                <button class="save-btn" onclick="saveAllSettings()">💾 તમામ Save</button>
            </div>
        </div>
    </div>

    <!-- MIC -->
    <div id="mic-container">
        <div id="status-text">🚀 તમામ Functions Active - 35 વંશજ તૈયાર!</div>
        <div style="display:flex;gap:25px;align-items:center;">
            <button id="mic-btn" class="round-btn" onclick="toggleMic()">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="round-btn" onclick="openVanshavali()" style="background:linear-gradient(45deg,#ffd700,#ffed4a);width:75px;height:75px;font-size:28px;">
                <i class="fas fa-globe"></i>
            </button>
        </div>
    </div>
