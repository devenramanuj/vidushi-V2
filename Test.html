<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidushi AI - Final Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/three-spritetext"></script>
    <script src="https://unpkg.com/3d-force-graph"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; font-family: 'Segoe UI', sans-serif; color: white; }
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; display: none; }
        #silent-video { display: block; }
        
        .side-btn { position: fixed; top: 20px; right: 20px; z-index: 20; background: rgba(0,0,0,0.7); color: white; border: 1px solid #ff4500; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .settings-box { background: #111; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; border: 1px solid #ff4500; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .menu-item { background: #222; padding: 15px; border-radius: 10px; border: 1px solid #444; text-align: center; cursor: pointer; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; color: white; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 15px; background: #ff4500; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; margin-top: 15px; }
        
        h4 { margin: 15px 0 5px; color: #ff4500; text-align: left; border-bottom: 1px solid #333; padding-bottom: 5px; }

        #mic-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20; text-align: center; width: 100%; }
        .round-btn { width: 70px; height: 70px; border-radius: 50%; border: none; color: white; font-size: 28px; cursor: pointer; background: #ff4500; box-shadow: 0 0 20px #ff4500; }
        
        #vanshavali-3d-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 300; }
        #close-graph { position: fixed; top: 20px; right: 20px; z-index: 310; background: red; color: white; border: none; padding: 12px; border-radius: 50%; width: 45px; height: 45px; font-weight: bold; }
        
        #selfie-video { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 5; border: 4px solid #ff4500; }
    </style>
</head>
<body>

    <video id="silent-video" autoplay muted loop playsinline><source src="silent.mp4"></video>
    <video id="talking-video" muted loop playsinline><source src="talking.mp4"></video>

    <video id="selfie-video" autoplay playsinline></video>
    <canvas id="canvas-capture" style="display:none;"></canvas>

    <button class="side-btn" onclick="window.openSettings()"><i class="fas fa-cog"></i></button>

    <div id="settings-modal" class="modal">
        <div class="settings-box">
            <h2 style="color:#ff4500; margin-top:0;">વિદુષી પ્રો સેટિંગ્સ</h2>
            
            <div class="menu-grid">
                <div class="menu-item" onclick="window.open3DVanshavali()"><i class="fas fa-project-diagram"></i><br>૩D વંશ</div>
                <div class="menu-item" onclick="window.startLens()"><i class="fas fa-eye"></i><br>લેન્સ (Lens)</div>
                <div class="menu-item" onclick="document.getElementById('docLoader').click()"><i class="fas fa-file-pdf"></i><br>RAG (PDF)</div>
                <div class="menu-item" onclick="alert('ડાયરી મોડ્યુલ લોડ થાય છે...')"><i class="fas fa-book"></i><br>ડાયરી</div>
            </div>

            <h4>૧. AI સેટિંગ્સ (Gemini / Groq)</h4>
            <select id="geminiModelSelect">
                <option value="gemini-2.5-flash">Gemini 2.5 Flash (Special)</option>
                <option value="gemini-2.5-pro">Gemini 2.5 Pro (Special)</option>
                <option value="llama-3.3-70b-versatile">Groq Llama 3.3 70B</option>
            </select>
            <input type="password" id="apiKeyInput" placeholder="AI API Key (Gemini/Groq)">

            <h4>૨. Firebase સેટિંગ્સ (ડેટા સ્ટોરેજ)</h4>
            <input type="text" id="fbApiKey" placeholder="Firebase API Key">
            <input type="text" id="fbProjectId" placeholder="Firebase Project ID">
            <input type="text" id="fbDatabaseUrl" placeholder="Database URL">

            <h4>૩. પ્રોફાઇલ</h4>
            <input type="text" id="userNameInput" placeholder="તમારું નામ">

            <button class="save-btn" onclick="window.saveSettings()">સેવ અને બંધ કરો</button>
        </div>
    </div>

    <div id="vanshavali-3d-modal">
        <button id="close-graph" onclick="window.close3DVanshavali()">X</button>
        <div id="graph-container"></div>
    </div>

    <input type="file" id="docLoader" style="display:none;" onchange="window.handleRAGUpload(this)">

    <div id="mic-container">
        <div id="status-text" style="margin-bottom:10px; font-weight:bold;">તૈયાર...</div>
        <button id="mic-btn" class="round-btn" onclick="window.startConversation()"><i class="fas fa-microphone"></i></button>
    </div>

    <script>
        // ૧. જગદગુરુ રામાનંદાચાર્યજીની વંશાવલી (ડેટા)
        const myFamilyData = {
            name: "જગદગુરુ રામાનંદાચાર્યજી", 
            info: "વિ. સં. ૧૩૫૬",
            children: [{
                name: "અનંતાનંદજી", 
                children: [{
                    name: "ગેંડાજી", 
                    children: [{
                        name: "લક્ષ્મીદાસજી", 
                        children: [{
                            name: "માધવદાસજી", 
                            children: [{
                                name: "ખોજીજી", 
                                children: [{
                                    name: "મહેન્દ્રદાસજી", 
                                    info: "પાલડી-મારવાડ (૧૪૯૫)", 
                                    children: [{
                                        name: "પુરણદાસજી બાપુ", 
                                        info: "ઝીંઝર સમાધિ (૧૯૩૧)", 
                                        children: [
                                            {
                                                name: "ગંગારામજી", 
                                                children: [
                                                    { 
                                                        name: "આશારામજી", 
                                                        children: [
                                                            { name: "ગિરધરદાસજી", children: [{ name: "હરીરામજી" }] }, 
                                                            { name: "મોજીરમજી", children: [{ name: "જેજેરામ", children: [{ name: "ગૌતમ" }] }] }, 
                                                            { name: "સીતારામજી", children: [{ name: "પ્રભુદાસ" }, { name: "રાજુભાઈ" }] }
                                                        ]
                                                    },
                                                    { 
                                                        name: "વ્રજેશરામજી", 
                                                        children: [
                                                            { name: "ભગવાનદાસજી", info: "ગાંગોદ", children: [{ name: "બાબુરામજી" }, { name: "ઈશ્વરદાસજી" }] }, 
                                                            { name: "તુલસીદાસજી", info: "રોજકા", children: [{ name: "મનસુખભાઈ" }, { name: "વિમુભાઈ" }, { name: "પરશુરામ" }] }
                                                        ]
                                                    }
                                                ]
                                            },
                                            {
                                                name: "રઘુરામજી", 
                                                children: [{
                                                    name: "દયારામજી", 
                                                    info: "દિવાળીબેન (ઝમરાળા)", 
                                                    children: [
                                                        { name: "કાશીરામજી", info: "રામપુર" }, 
                                                        { name: "વશરામજી", info: "સંખેજ" }, 
                                                        { 
                                                            name: "જાનકીદાસજી", 
                                                            info: "ઝીંઝર", 
                                                            children: [
                                                                { name: "મનહરલાલ" }, { name: "પ્રતાપભાઈ" }, { name: "વૈકુંઠભાઈ" }, { name: "સતીષભાઈ" }, { name: "દેવેન્દ્રભાઈ" }
                                                            ]
                                                        }
                                                    ]
                                                }]
                                            }
                                        ]
                                    }]
                                }]
                            }]
                        }]
                    }]
                }]
            }]
        };

        // ૨. ૩D ગ્રાફ ફંક્શન - મોબાઇલ ફિક્સ સાથે
        window.open3DVanshavali = () => {
            document.getElementById('settings-modal').style.display = 'none';
            document.getElementById('vanshavali-3d-modal').style.display = 'block';
            
            const elem = document.getElementById('graph-container');
            elem.innerHTML = ""; // સાફ કરો
            elem.style.width = '100vw';
            elem.style.height = '100vh';

            setTimeout(() => {
                const nodes = [], links = [];
                function parse(node, parent = null) {
                    nodes.push({ id: node.name, info: node.info || "" });
                    if(parent) links.push({ source: parent.name, target: node.name });
                    if(node.children) node.children.forEach(c => parse(c, node));
                }
                parse(myFamilyData);

                const Graph = ForceGraph3D()(elem)
                    .graphData({ nodes, links })
                    .nodeAutoColorBy('id')
                    .backgroundColor('#000000')
                    .showNavInfo(false)
                    .nodeThreeObject(node => {
                        const sprite = new SpriteText(node.id);
                        sprite.color = '#ffffff';
                        sprite.textHeight = 5;
                        return sprite;
                    })
                    .nodeThreeObjectExtend(true);
            }, 300);
        };

        window.close3DVanshavali = () => { document.getElementById('vanshavali-3d-modal').style.display = 'none'; };

        // ૩. સેટિંગ્સ મેનેજમેન્ટ
        window.openSettings = () => {
            document.getElementById('settings-modal').style.display = 'flex';
            document.getElementById('userNameInput').value = localStorage.getItem('vidushi_username') || "";
            document.getElementById('apiKeyInput').value = localStorage.getItem('vidushi_key') || "";
            document.getElementById('fbApiKey').value = localStorage.getItem('fb_key') || "";
            document.getElementById('fbProjectId').value = localStorage.getItem('fb_id') || "";
            document.getElementById('fbDatabaseUrl').value = localStorage.getItem('fb_db') || "";
        };

        window.saveSettings = () => {
            localStorage.setItem('vidushi_username', document.getElementById('userNameInput').value);
            localStorage.setItem('vidushi_key', document.getElementById('apiKeyInput').value);
            localStorage.setItem('fb_key', document.getElementById('fbApiKey').value);
            localStorage.setItem('fb_id', document.getElementById('fbProjectId').value);
            localStorage.setItem('fb_db', document.getElementById('fbDatabaseUrl').value);
            document.getElementById('settings-modal').style.display = 'none';
            alert("સેટિંગ્સ સેવ થયા છે!");
        };

        // ૪. Lens અને બેઝિક ફંક્શન્સ
        window.startLens = async () => {
            document.getElementById('settings-modal').style.display = 'none';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const v = document.getElementById('selfie-video');
                v.srcObject = stream; v.style.display = 'block';
                setTimeout(() => {
                    stream.getTracks().forEach(t => t.stop());
                    v.style.display = 'none';
                    alert("Lens સ્કેન પૂરું થયું.");
                }, 4000);
            } catch(e) { alert("કેમેરા એરર: " + e); }
        };

        window.startConversation = () => {
            const rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
            rec.lang = 'gu-IN';
            rec.start();
            rec.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('status-text').innerText = text;
            };
        };
    </script>
</body>
</html>
