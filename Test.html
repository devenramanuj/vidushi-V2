<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidushi AI - Jagadguru Vanshavali</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    
    <script src="//unpkg.com/3d-force-graph"></script>
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/three-spritetext"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; font-family: 'Segoe UI', sans-serif; color: white; }
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; display: none; }
        #silent-video { display: block; }
        
        .side-btn { position: fixed; top: 20px; right: 20px; z-index: 20; background: rgba(0,0,0,0.6); color: white; border: 1px solid #ff4500; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
        .settings-box { background: #111; padding: 25px; border-radius: 15px; width: 85%; max-width: 380px; border: 1px solid #ff4500; text-align: center; }
        
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #222; color: white; border: 1px solid #444; border-radius: 5px; }
        .save-btn { width: 100%; padding: 12px; background: #ff4500; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
        
        #mic-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20; text-align: center; width: 100%; }
        .round-btn { width: 65px; height: 65px; border-radius: 50%; border: none; color: white; font-size: 24px; cursor: pointer; background: #ff4500; box-shadow: 0 0 15px #ff4500; }
        
        #vanshavali-3d-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 300; }
        #close-graph { position: fixed; top: 20px; right: 20px; z-index: 310; background: red; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="silent-video" autoplay muted loop playsinline><source src="silent.mp4"></video>
        <video id="talking-video" muted loop playsinline><source src="talking.mp4"></video>
    </div>

    <button class="side-btn" onclick="window.openSettings()"><i class="fas fa-cog"></i></button>

    <div id="settings-modal" class="modal">
        <div class="settings-box">
            <h3>વિદુષી સેટિંગ્સ</h3>
            <button class="save-btn" style="background:#333; margin-bottom:10px;" onclick="window.open3DVanshavali()">
                <i class="fas fa-project-diagram"></i> ૩D વંશાવલી જુઓ
            </button>
            
            <label>AI Model:</label>
            <select id="geminiModelSelect">
                <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                <option value="llama-3.3-70b-versatile">Groq Llama 70B</option>
            </select>
            
            <input type="password" id="apiKeyInput" placeholder="API Key અહીં નાખો">
            <input type="text" id="userNameInput" placeholder="તમારું નામ">
            <button class="save-btn" onclick="window.saveSettings()">SAVE & CLOSE</button>
        </div>
    </div>

    <div id="vanshavali-3d-modal">
        <button id="close-graph" onclick="window.close3DVanshavali()">બંધ કરો</button>
        <div id="graph-container"></div>
    </div>

    <div id="mic-container">
        <div id="status-text" style="margin-bottom:10px;">તૈયાર...</div>
        <button id="mic-btn" class="round-btn" onclick="window.startConversation()"><i class="fas fa-microphone"></i></button>
    </div>

    <script>
        // --- ૧. શુદ્ધ વંશાવલી ડેટા ---
        const myFamilyData = {
            name: "જગદગુરુ રામાનંદાચાર્યજી", 
            info: "વિ. સં. ૧૩૫૬",
            children: [{
                name: "અનંતાનંદજી", 
                children: [{
                    name: "ગેંડાજી", 
                    children: [{
                        name: "લક્ષ્મીદાસજી", 
                        children: [{
                            name: "માધવદાસજી", 
                            children: [{
                                name: "ખોજીજી", 
                                children: [{
                                    name: "મહેન્દ્રદાસજી", 
                                    info: "પાલડી-મારવાડ (૧૪૯૫)", 
                                    children: [{
                                        name: "પુરણદાસજી બાપુ", 
                                        info: "ઝીંઝર સમાધિ (૧૯૩૧)", 
                                        children: [
                                            {
                                                name: "ગંગારામજી", 
                                                children: [
                                                    { 
                                                        name: "આશારામજી", 
                                                        children: [
                                                            { name: "ગિરધરદાસજી", children: [{ name: "હરીરામજી" }] }, 
                                                            { name: "મોજીરમજી", children: [{ name: "જેજેરામ", children: [{ name: "ગૌતમ" }] }] }, 
                                                            { name: "સીતારામજી", children: [{ name: "પ્રભુદાસ" }, { name: "રાજુભાઈ" }] }
                                                        ]
                                                    },
                                                    { 
                                                        name: "વ્રજેશરામજી", 
                                                        children: [
                                                            { name: "ભગવાનદાસજી", info: "ગાંગોદ", children: [{ name: "બાબુરામજી" }, { name: "ઈશ્વરદાસજી" }] }, 
                                                            { name: "તુલસીદાસજી", info: "રોજકા", children: [{ name: "મનસુખભાઈ" }, { name: "વિમુભાઈ" }, { name: "પરશુરામ" }] }
                                                        ]
                                                    }
                                                ]
                                            },
                                            {
                                                name: "રઘુરામજી", 
                                                children: [{
                                                    name: "દયારામજી", 
                                                    info: "દિવાળીબેન (ઝમરાળા)", 
                                                    children: [
                                                        { name: "કાશીરામજી", info: "રામપુર" }, 
                                                        { name: "વશરામજી", info: "સંખેજ" }, 
                                                        { 
                                                            name: "જાનકીદાસજી", 
                                                            info: "ઝીંઝર", 
                                                            children: [
                                                                { name: "મનહરલાલ" }, { name: "પ્રતાપભાઈ" }, { name: "વૈકુંઠભાઈ" }, { name: "સતીષભાઈ" }, { name: "દેવેન્દ્રભાઈ" }
                                                            ]
                                                        }
                                                    ]
                                                }]
                                            }
                                        ]
                                    }]
                                }]
                            }]
                        }]
                    }]
                }]
            }]
        };

        // --- ૨. ૩D ગ્રાફ ફંક્શન (શુદ્ધ ડેટા સાથે) ---
        window.open3DVanshavali = () => {
            document.getElementById('settings-modal').style.display = 'none';
            document.getElementById('vanshavali-3d-modal').style.display = 'block';
            
            const nodes = [], links = [];
            function parse(node, parent = null) {
                const id = node.name;
                nodes.push({ id: id, info: node.info || "" });
                if(parent) links.push({ source: parent.name, target: id });
                if(node.children) node.children.forEach(c => parse(c, node));
            }
            parse(myFamilyData);

            // ગ્રાફ કન્ટેનરને સાફ કરો
            document.getElementById('graph-container').innerHTML = '';

            const Graph = ForceGraph3D()(document.getElementById('graph-container'))
                .graphData({ nodes, links })
                .nodeAutoColorBy('id')
                .backgroundColor('#000000')
                .nodeThreeObject(node => {
                    // નામ બતાવવા માટે SpriteText નો ઉપયોગ
                    const sprite = new SpriteText(node.id);
                    sprite.color = '#ffffff';
                    sprite.textHeight = 6; // ટેક્સ્ટની સાઈઝ
                    return sprite;
                })
                .nodeThreeObjectExtend(true) // બિંદુ પણ રાખવું અને નામ પણ
                .onNodeClick(node => {
                    window.speak(node.id + " " + node.info);
                });

            // ગ્રાફને સેન્ટરમાં ગોઠવો
            Graph.d3Force('charge').strength(-150);
        };

        window.close3DVanshavali = () => {
            document.getElementById('vanshavali-3d-modal').style.display = 'none';
        };

        // --- ૩. બેઝિક સેટિંગ્સ ---
        window.openSettings = () => { document.getElementById('settings-modal').style.display='flex'; };
        window.saveSettings = () => {
            localStorage.setItem('vidushi_username', document.getElementById('userNameInput').value);
            localStorage.setItem('vidushi_key', document.getElementById('apiKeyInput').value);
            document.getElementById('settings-modal').style.display='none';
            window.speak("સેટિંગ્સ સેવ થયા.");
        };

        window.speak = (text) => {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'gu-IN';
            u.onstart = () => { document.getElementById('talking-video').style.display='block'; };
            u.onend = () => { document.getElementById('talking-video').style.display='none'; };
            window.speechSynthesis.speak(u);
        };
        
        window.startConversation = () => {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'gu-IN';
            rec.start();
            rec.onresult = (e) => {
                const speech = e.results[0][0].transcript;
                document.getElementById('status-text').innerText = speech;
                // અહીં તમે તમારી API Call ઉમેરી શકો છો
                window.speak("તમે કહ્યું: " + speech);
            };
        };
    </script>
</body>
</html>
