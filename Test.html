<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidushi AI - Firebase Professional Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three-spritetext@1.8.2/dist/three-spritetext.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>

    <style>
        :root { --primary: #ff4500; --bg: #000; --card: #111; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; color: white; }
        
        /* UI Elements */
        .side-btn { position: fixed; top: 20px; right: 20px; z-index: 100; background: rgba(255,69,0,0.2); color: white; border: 1px solid var(--primary); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .side-btn:hover { background: var(--primary); box-shadow: 0 0 15px var(--primary); }

        /* Modal / Settings */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; overflow-y: auto; }
        .settings-box { background: var(--card); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid var(--primary); box-shadow: 0 0 30px rgba(255,69,0,0.2); }
        h3, h4 { color: var(--primary); text-align: center; margin-top: 0; }
        label { font-size: 14px; color: #aaa; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; color: white; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; margin-top: 10px; transition: 0.2s; }
        .btn-action:active { transform: scale(0.98); }

        /* Mic Button */
        #mic-container { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 50; text-align: center; }
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; color: white; font-size: 32px; background: var(--primary); box-shadow: 0 0 25px var(--primary); cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 69, 0, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 69, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 69, 0, 0); } }

        /* 3D Graph Container */
        #vanshavali-3d-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 300; }
        #close-graph { position: fixed; top: 20px; right: 20px; z-index: 310; background: #ff0000; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #status-text { background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <button class="side-btn" onclick="window.toggleSettings(true)"><i class="fas fa-cog"></i></button>

    <div id="settings-modal" class="modal">
        <div class="settings-box">
            <h3>વિદુષી AI સેટિંગ્સ</h3>
            <button class="btn-action" style="background:#333; margin-bottom: 15px;" onclick="window.open3DVanshavali()">
                <i class="fas fa-project-diagram"></i> ૩D વંશાવલી જુઓ
            </button>
            <hr style="border: 0.5px solid #333;">
            
            <label>AI Model:</label>
            <select id="modelSelect">
                <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                <option value="llama-3.3-70b-versatile">Groq Llama 70B</option>
            </select>

            <label>AI API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="તમારી AI API Key">

            <label>તમારું નામ:</label>
            <input type="text" id="userNameInput" placeholder="દા.ત. શિવાનંદ">

            <div style="background: #1a1a1a; padding: 10px; border-radius: 10px; margin-top: 15px;">
                <h4>સુરક્ષા (Firebase API Key)</h4>
                <p style="font-size: 11px; color: #888;">*આ કી બ્રાઉઝરમાં સુરક્ષિત રીતે સેવ થશે.</p>
                <input type="password" id="fbApiKey" placeholder="Firebase API Key દાખલ કરો">
            </div>

            <button class="btn-action" onclick="window.saveSettings()">સાચવો અને કનેક્ટ કરો</button>
            <button class="btn-action" style="background:transparent; color:#888;" onclick="window.toggleSettings(false)">બંધ કરો</button>
        </div>
    </div>

    <div id="vanshavali-3d-modal">
        <button id="close-graph" onclick="window.close3DVanshavali()">બંધ કરો</button>
        <div id="graph-container"></div>
    </div>

    <div id="mic-container">
        <div id="status-text">તૈયાર... બોલવા માટે દબાવો</div>
        <button id="mic-btn" class="mic-btn" onclick="window.listen()"><i class="fas fa-microphone"></i></button>
    </div>

    <script>
        let db;

        // ૧. Firebase Configuration (બાકીના સેટિંગ્સ અહીં કોડમાં છે)
        const firebaseBaseConfig = {
            projectId: "તમારો-પ્રોજેક્ટ-આઈડી", // અહીં તમારો પ્રોજેક્ટ આઈડી લખો
            databaseURL: "https://તમારો-પ્રોજેક્ટ.firebaseio.com", // અહીં તમારો DB URL લખો
            appId: "૧:૧૨૩૪૫:web:abc", // અહીં તમારો App ID લખો
            storageBucket: "તમારો-પ્રોજેક્ટ.appspot.com"
        };

        // ૨. Firebase Initialize (Settings માંથી API Key લઈને)
        window.initFirebase = () => {
            const secureKey = localStorage.getItem('fb_api_key');
            if (secureKey && !firebase.apps.length) {
                const finalConfig = { ...firebaseBaseConfig, apiKey: secureKey };
                firebase.initializeApp(finalConfig);
                db = firebase.database();
                console.log("✅ Firebase Connected!");
            }
        };

        // ૩. ૩D વંશાવલી ડેટા
        const vData = { 
            name: "જગદગુરુ રામાનંદાચાર્યજી", 
            children: [
                { name: "અનંતાનંદજી", children: [
                    { name: "ગેંડાજી", children: [
                        { name: "લક્ષ્મીદાસજી", children: [{ name: "માધવદાસજી" }] }
                    ]}
                ]}
            ] 
        };

        window.open3DVanshavali = () => {
            window.toggleSettings(false);
            document.getElementById('vanshavali-3d-modal').style.display = 'block';
            const elem = document.getElementById('graph-container');
            elem.innerHTML = ""; // ક્લિયર જૂનો ગ્રાફ

            const nodes = [], links = [];
            const parse = (n, p = null) => {
                nodes.push({ id: n.name });
                if(p) links.push({ source: p.name, target: n.name });
                if(n.children) n.children.forEach(c => parse(c, n));
            };
            parse(vData);

            const Graph = ForceGraph3D()(elem)
                .graphData({ nodes, links })
                .backgroundColor('#000000')
                .nodeThreeObject(node => {
                    const sprite = new SpriteText(node.id);
                    sprite.color = '#ff4500';
                    sprite.textHeight = 6;
                    return sprite;
                }).nodeThreeObjectExtend(true)
                .linkColor(() => '#444');
        };

        window.close3DVanshavali = () => document.getElementById('vanshavali-3d-modal').style.display = 'none';

        // ૪. Settings Save
        window.saveSettings = () => {
            const fbKey = document.getElementById('fbApiKey').value;
            const aiKey = document.getElementById('apiKeyInput').value;
            const uName = document.getElementById('userNameInput').value;

            if(!fbKey) { alert("મહેરબાની કરીને Firebase API Key નાખો!"); return; }

            localStorage.setItem('fb_api_key', fbKey);
            localStorage.setItem('api_key', aiKey);
            localStorage.setItem('user_name', uName);

            window.initFirebase();
            window.toggleSettings(false);
            alert("સેટિંગ્સ સફળતાપૂર્વક સાચવવામાં આવ્યા છે!");
        };

        window.toggleSettings = (show) => {
            document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
            if(show) {
                document.getElementById('fbApiKey').value = localStorage.getItem('fb_api_key') || "";
                document.getElementById('apiKeyInput').value = localStorage.getItem('api_key') || "";
                document.getElementById('userNameInput').value = localStorage.getItem('user_name') || "";
            }
        };

        // ૫. Voice Recognition & Firebase Save
        window.listen = () => {
            if (!db) { alert("પહેલા સેટિંગ્સમાં જઈ Firebase કનેક્ટ કરો!"); return; }

            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'gu-IN';
            
            document.getElementById('status-text').innerText = "સાંભળી રહ્યું છે...";
            document.getElementById('mic-btn').style.background = "red";

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('status-text').innerText = "તમે બોલ્યા: " + text;
                
                // Firebase માં સેવ કરો
                const userName = localStorage.getItem('user_name') || "અજાણ્યો";
                db.ref('vidushi_diary/' + userName).push({
                    message: text,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    console.log("Data Saved to Firebase");
                });
            };

            recognition.onend = () => {
                document.getElementById('mic-btn').style.background = "#ff4500";
            };
            
            recognition.start();
        };

        // પેજ લોડ વખતે Firebase શરૂ કરો
        window.onload = window.initFirebase;
    </script>
</body>
</html>
