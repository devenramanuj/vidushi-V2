<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidushi-AI | Perpetual Build</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root { --p: #ff4500; --b: #000; }
        body { background: var(--b); color: white; font-family: sans-serif; margin: 0; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 15px; text-align: center; cursor: pointer; }
        .card i { font-size: 24px; color: var(--p); margin-bottom: 8px; }
        #status { background: #111; padding: 15px; border-radius: 15px; margin-top: 20px; border-left: 4px solid var(--p); min-height: 40px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 10px; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="color:var(--p)">VIDUSHI-AI</h2>
        <i class="fas fa-cog" onclick="toggleSettings()"></i>
    </div>

    <div id="settings" class="hidden">
        <input type="password" id="apiKey" placeholder="Gemini API Key નાખો">
        <button onclick="saveKey()" style="width:100%; padding:10px; background:var(--p); border:none; color:white; border-radius:10px;">સેવ કરો</button>
    </div>

    <div class="menu-grid">
        <div class="card" onclick="startVoice()"><i class="fas fa-microphone"></i><br>વાત કરો</div>
        <div class="card" onclick="startLens()"><i class="fas fa-camera"></i><br>સ્માર્ટ લેન્સ</div>
        </div>

    <div id="status">સિસ્ટમ તૈયાર છે...</div>
    <canvas id="canvas" class="hidden"></canvas>

    <script>
        // --- ⚙️ કોર એન્જિન (આ ક્યારેય નહીં બદલાય) ---
        function saveKey() { localStorage.setItem('v_key', document.getElementById('apiKey').value); toggleSettings(); alert("કી સેવ થઈ ગઈ!"); }
        function toggleSettings() { document.getElementById('settings').classList.toggle('hidden'); }
        function speak(t) { const u = new SpeechSynthesisUtterance(t); u.lang = 'gu-IN'; window.speechSynthesis.speak(u); }

        async function askGemini(query, image = null) {
            const key = localStorage.getItem('v_key');
            if(!key) return alert("પહેલા સેટિંગ્સમાં API Key નાખો!");
            
            let payload = image ? 
                { contents: [{ parts: [{ text: "Explain this in Gujarati." }, { inline_data: { mime_type: "image/jpeg", data: image } }] }] } :
                { contents: [{ parts: [{ text: "જવાબ ગુજરાતીમાં આપો: " + query }] }] };

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
                });
                const data = await res.json();
                const txt = data.candidates[0].content.parts[0].text;
                document.getElementById('status').innerText = txt;
                speak(txt);
            } catch (e) { document.getElementById('status').innerText = "ભૂલ આવી! API Key ચેક કરો."; }
        }

        // --- 🎤 Voice Feature ---
        function startVoice() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'gu-IN';
            rec.onstart = () => document.getElementById('status').innerText = "સાંભળી રહી છું...";
            rec.onresult = (e) => {
                const q = e.results[0][0].transcript;
                document.getElementById('status').innerText = "તમે પૂછ્યું: " + q;
                askGemini(q);
            };
            rec.start();
        }

        // --- 📷 Lens Feature ---
        async function startLens() {
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            const v = document.createElement('video'); v.srcObject = s; v.play();
            document.getElementById('status').innerText = "૩ સેકન્ડમાં સ્કેન થશે...";
            setTimeout(() => {
                const c = document.getElementById('canvas');
                c.width = 640; c.height = 480; // Standard resolution
                c.getContext('2d').drawImage(v, 0, 0, 640, 480);
                const b64 = c.toDataURL('image/jpeg').split(',')[1];
                s.getTracks().forEach(t => t.stop());
                askGemini(null, b64);
            }, 3000);
        }

        // --- 🧩 ADD NEW FEATURES HERE (નવા ફીચર નીચે ઉમેરવા) ---
// --- 📖 Diary Feature ---
function addToDiary() {
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = 'gu-IN';
    rec.onstart = () => document.getElementById('status').innerText = "ડાયરી માટે બોલો...";
    rec.onresult = (e) => {
        const note = e.results[0][0].transcript;
        const diary = JSON.parse(localStorage.getItem('my_diary') || "[]");
        const entry = { date: new Date().toLocaleString(), text: note };
        diary.push(entry);
        localStorage.setItem('my_diary', JSON.stringify(diary));
        document.getElementById('status').innerText = "ડાયરીમાં નોંધાયું: " + note;
        speak("મેં ડાયરીમાં નોંધી લીધું છે.");
    };
    rec.start();
}

function showDiary() {
    const diary = JSON.parse(localStorage.getItem('my_diary') || "[]");
    if(diary.length === 0) return alert("ડાયરી ખાલી છે.");
    let allNotes = diary.map(n => n.date + ": " + n.text).join("\n\n");
    alert(allNotes);
}

    </script>
</body>
</html>
