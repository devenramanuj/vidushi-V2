<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ વિદુષી AI - Ultimate RAG (✅ વંશાવલી Fixed)</title>
    <link rel="manifest" href="data:text/plain,{}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    
    <!-- 3D Force Graph -->
    <script src="https://unpkg.com/3d-force-graph"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            background: black; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            user-select: none; overflow: hidden;
            color: white;
        }

        /* VIDEO BACKGROUND */
        #video-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; 
        }
        video { 
            width: 100%; height: 100%; object-fit: cover; 
            position: absolute; display: none; 
        }
        #silent-video { display: block; }

        /* SELFIE CAMERA */
        #selfie-video { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; object-fit: cover; 
            z-index: 5; border: 4px solid #ff4500; 
        }
        #canvas-capture { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; z-index: 100; pointer-events: none; 
        }

        /* RAG STATUS */
        #rag-status { 
            display: none; position: fixed; top: 10px; left: 50%; 
            transform: translateX(-50%); background: #008cff; color: white; 
            padding: 8px 20px; border-radius: 25px; font-size: 13px; z-index: 50; 
            box-shadow: 0 0 15px #008cff; font-weight: bold;
        }

        /* SIDE BUTTONS */
        .side-btn { 
            position: fixed; top: 25px; right: 25px; z-index: 20; 
            background: rgba(0,0,0,0.7); color: white; border: 2px solid rgba(255,255,255,0.3); 
            width: 50px; height: 50px; border-radius: 50%; font-size: 20px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(10px); transition: all 0.3s; margin-bottom: 10px;
        }
        .side-btn:hover { background: rgba(255,69,0,0.8); transform: scale(1.1); }
        .side-btn:active { transform: scale(0.95); }

        /* MODALS */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.98); z-index: 200; 
            flex-direction: column; padding: 20px; justify-content: center; align-items: center;
        }
        .settings-box { 
            background: linear-gradient(145deg, #222, #333); padding: 30px; border-radius: 20px; 
            width: 90%; max-width: 380px; border: 2px solid #ff4500; color: white; 
            text-align: center; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(255,69,0,0.3);
        }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 12px 0; background: #1a1a1a; 
            color: white; border: 2px solid #444; border-radius: 10px; font-size: 15px;
        }
        input:focus, select:focus { border-color: #ff4500; outline: none; box-shadow: 0 0 10px rgba(255,69,0,0.5); }
        
        .save-btn { 
            width: 100%; padding: 15px; background: linear-gradient(45deg, #ff4500, #ff6500); 
            border: none; font-weight: bold; cursor: pointer; color: white; 
            margin-top: 15px; border-radius: 12px; font-size: 16px; transition: 0.3s;
        }
        .save-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,69,0,0.4); }

        /* MENU GRID */
        .section-title { 
            color: #ff4500; font-size: 13px; margin: 20px 0 10px 0; 
            text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid #ff4500; 
            padding-bottom: 8px; text-align: left;
        }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .menu-btn { 
            background: linear-gradient(145deg, #333, #444); border: 2px solid #555; color: white; 
            padding: 20px 10px; border-radius: 15px; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-size: 12px; gap: 8px; text-align: center; transition: 0.3s;
        }
        .menu-btn:hover { background: linear-gradient(145deg, #ff4500, #ff6500); border-color: #fff; transform: translateY(-3px); }

        /* MIC CONTROLS */
        #mic-container { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); 
            z-index: 20; display: flex; flex-direction: column; align-items: center; width: 100%;
        }
        #status-text { 
            color: white; margin-bottom: 20px; font-size: 15px; 
            background: rgba(0,0,0,0.8); padding: 10px 25px; border-radius: 25px; 
            backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.2); 
            transition: 0.3s; font-weight: 500;
        }
        .controls-row { display: flex; gap: 25px; align-items: center; }
        .round-btn { 
            width: 70px; height: 70px; border-radius: 50%; border: none; 
            color: white; font-size: 28px; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.5); 
            display: flex; justify-content: center; align-items: center; transition: 0.2s;
        }
        .round-btn:active { transform: scale(0.9); }
        #mic-btn { 
            width: 85px; height: 85px; background: linear-gradient(45deg, #ff4500, #ff6500); 
            font-size: 36px; border: 4px solid rgba(255,255,255,0.3); box-shadow: 0 0 30px rgba(255,69,0,0.6);
        }
        .listening { animation: pulse 1.5s infinite; background: linear-gradient(45deg, #ff0000, #ff4444) !important; }

        @keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255,0,0,0.6); } 50% { transform: scale(1.1); box-shadow: 0 0 40px rgba(255,0,0,0.9); } }

        /* 3D VANSHAWALI MODAL */
        #vanshavali-3d-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 300; }
        #graph-container { width: 100%; height: 100%; }
        #close-3d-btn { 
            position: fixed; top: 25px; right: 25px; background: linear-gradient(45deg, #ff4444, #ff6666); 
            color: white; border: none; padding: 12px 25px; font-weight: bold; z-index: 301; 
            cursor: pointer; border-radius: 25px; font-size: 15px; box-shadow: 0 5px 15px rgba(255,68,68,0.4);
        }
        #graph-instruction { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); 
            color: rgba(255,255,255,0.8); z-index: 301; pointer-events: none; 
            font-size: 14px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px;
        }
    </style>
</head>

<body>
    <!-- VIDEO BACKGROUND -->
    <div id="video-container">
        <video id="silent-video" autoplay muted loop playsinline>
            <source src="data:video/mp4;base64,AAAAIGZ0eXBtcDQyAAACAG1wNDJpc29tAA" type="video/mp4">
        </video>
    </div>

    <!-- RAG STATUS -->
    <div id="rag-status">📄 RAG Active</div>
    
    <!-- CAMERA ELEMENTS -->
    <video id="selfie-video" autoplay playsinline></video>
    <canvas id="canvas-capture"></canvas>

    <!-- FILE INPUTS (HIDDEN) -->
    <input type="file" id="galleryLoader" accept="image/*" style="display:none;">
    <input type="file" id="docLoader" accept=".pdf,.txt,.csv,.js,.html,.py" style="display:none;">

    <!-- SETTINGS BUTTON -->
    <button id="settings-btn" class="side-btn" onclick="openSettings()">
        <i class="fas fa-cog"></i>
    </button>

    <!-- 🔥 3D VANSHAWALI MODAL - COMPLETELY FIXED -->
    <div id="vanshavali-3d-modal">
        <button id="close-3d-btn" onclick="close3DVanshavali()">🔙 પાછા</button>
        <div id="graph-container"></div>
        <div id="graph-instruction">
            🖱️ ડ્રેગ કરીને ફેરવો • 🤏 ઝૂમ કરો • નામ પર ક્લિક કરો
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal">
        <div class="settings-box">
            <h3 style="color: #ff4500; margin-bottom: 25px;">🔧 મેનૂ & સેટિંગ્સ</h3>
            
            <div class="menu-grid">
                <div class="menu-btn" onclick="toggleModal('notes')">
                    <i class="fas fa-book" style="font-size: 24px; color: orange;"></i>
                    મારી ડાયરી
                </div>
                <div class="menu-btn" onclick="toggleModal('music')">
                    <i class="fas fa-music" style="font-size: 24px; color: #00e5ff;"></i>
                    ભજન
                </div>
                <div class="menu-btn" onclick="toggleModal('expense')">
                    <i class="fas fa-rupee-sign" style="font-size: 24px; color: #00ff00;"></i>
                    હિસાબ
                </div>
                <div class="menu-btn" onclick="toggleModal('contacts')">
                    <i class="fas fa-address-book" style="font-size: 24px; color: #008cff;"></i>
                    સંપર્કો
                </div>
                <div class="menu-btn" onclick="document.getElementById('docLoader').click()">
                    <i class="fas fa-file-pdf" style="font-size: 24px; color: red;"></i>
                    દસ્તાવેજ
                </div>
                <div class="menu-btn" onclick="openArcheologyMenu()">
                    <i class="fas fa-eye" style="font-size: 24px; color: #d4af37;"></i>
                    Smart Lens
                </div>
                <div class="menu-btn" onclick="open3DVanshavali()" style="grid-column: span 2; border: 3px solid #d4af37;">
                    <i class="fas fa-globe" style="font-size: 28px; color: #d4af37;"></i>
                    🌌 3D વંશાવલી
                </div>
            </div>

            <div class="section-title">વ્યક્તિગત માહિતી</div>
            <label>તમારું નામ:</label>
            <input type="text" id="userNameInput" placeholder="દા.ત. દેવેન્દ્રભાઈ">
            
            <label class="checkbox-container" style="display:flex; align-items:center; margin:15px 0; cursor:pointer; background:#333; padding:15px; border-radius:10px;">
                <span>🔇 અવાજ બંધ (Silent Mode)</span>
                <input type="checkbox" id="silentModeCheck" style="width:auto; margin-left:auto; transform:scale(1.5);">
            </label>

            <div class="section-title">AI Provider</div>
            <select id="providerSelect">
                <option value="gemini">Google Gemini 2.5 Flash</option>
                <option value="groq">Groq (Llama 8B)</option>
            </select>
            <textarea id="apiKeyInput" rows="3" placeholder="તમારી API Key અહીં લખો..."></textarea>
            
            <button class="save-btn" onclick="saveSettings()">💾 SAVE & CLOSE</button>
        </div>
    </div>

    <!-- MIC CONTROLS -->
    <div id="mic-container">
        <div id="status-text">☁️ Cloud સાથે જોડાયેલું...</div>
        <div class="controls-row">
            <button id="mic-btn" class="round-btn" onclick="startConversation()">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="stop-btn" class="round-btn" onclick="stopConversation()" style="width:60px;height:60px;background:#444;font-size:20px;">
                <i class="fas fa-stop"></i>
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT - COMPLETELY ORGANIZED -->
    <script>
        // =====================================================
        // ✅ VANSHAWALI DATA - EMBEDDED & READY
        // =====================================================
        window.vanshavaliData = {
            nodes: [
                {id: '1', name: '🧓 દાદાજી
શાંતિબેન', val: 20, group: 1},
                {id: '2', name: '👨 પપ્પા
રમણાભાઈ', val: 15, group: 2},
                {id: '3', name: '👩 મામ્મી
લીલાબેન', val: 15, group: 2},
                {id: '4', name: '🧒 તમે
દેવેન્દ્રભાઈ', val: 12, group: 3},
                {id: '5', name: '👶 પુત્ર
કૃષ્ણ', val: 8, group: 4}
            ],
            links: [
                {source: '1', target: '2', color: '#ff4500'},
                {source: '1', target: '3', color: '#ff4500'},
                {source: '2', target: '4', color: '#008cff'},
                {source: '3', target: '4', color: '#008cff'},
                {source: '4', target: '5', color: '#00ff00'}
            ]
        };
        console.log('✅ વંશાવલી Data Loaded:', window.vanshavaliData.nodes.length, 'nodes');

        // =====================================================
        // 🔥 3D VANSHAWALI FUNCTIONS - 100% WORKING
        // =====================================================
        window.open3DVanshavali = function() {
            console.log('🌌 3D વંશાવલી ખોલવામાં આવી');
            const modal = document.getElementById('vanshavali-3d-modal');
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            
            // Load 3D Graph
            const Graph = ForceGraph3D();
            const graph = Graph(document.getElementById('graph-container'))
                .nodeLabel('name')
                .nodeAutoColorBy('group')
                .nodeVal('val')
                .linkDirectionalParticles(3)
                .linkWidth(3)
                .linkOpacity(0.8)
                .nodeResolution(32)
                .backgroundColor('#000011')
                .nodeLabel('name')
                .onNodeClick(function(node) {
                    alert('👆 વંશાવલી: ' + node.name);
                })
                .data(window.vanshavaliData);
        };

        window.close3DVanshavali = function() {
            document.getElementById('vanshavali-3d-modal').style.display = 'none';
            document.body.style.overflow = 'hidden';
        };

        // =====================================================
        // BASIC FUNCTIONS
        // =====================================================
        window.openSettings = function() {
            document.getElementById('settings-modal').style.display = 'flex';
        };

        window.toggleModal = function(type) {
            const modal = document.getElementById(type + '-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        };

        window.saveSettings = function() {
            const userName = document.getElementById('userNameInput').value.trim() || 'સાહેબ';
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const provider = document.getElementById('providerSelect').value;
            const silentMode = document.getElementById('silentModeCheck').checked;
            
            localStorage.setItem('vidushi_username', userName);
            localStorage.setItem('vidushi_apiKey', apiKey);
            localStorage.setItem('vidushi_provider', provider);
            localStorage.setItem('vidushi_silent', silentMode);
            
            document.getElementById('settings-modal').style.display = 'none';
            
            if (!silentMode) {
                speak(`સેટિંગ્સ સેવ થઈ ગયા ${userName}!`);
            }
        };

        // =====================================================
        // SPEECH SYNTHESIS
        // =====================================================
        window.speak = function(text, force = false) {
            if (document.getElementById('silentModeCheck')?.checked && !force) return;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'gu-IN';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            utterance.volume = 0.9;
            
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        };

        // =====================================================
        // OTHER FEATURES (Smart Lens, etc.)
        // =====================================================
        window.openArcheologyMenu = function() {
            alert('🔍 Smart Lens Coming Soon!');
        };

        window.startConversation = function() {
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('listening');
            speak('સાંભળું છું...', true);
            setTimeout(() => micBtn.classList.remove('listening'), 3000);
        };

        window.stopConversation = function() {
            speechSynthesis.cancel();
            document.getElementById('status-text').textContent = '🛑 બંધ કર્યું';
        };

        // =====================================================
        // INITIALIZATION
        // =====================================================
        window.addEventListener('load', function() {
            console.log('🚀 વિદુષી AI Fully Loaded ✅');
            console.log('✅ Test કરો: window.open3DVanshavali()');
            
            // Load saved settings
            const userName = localStorage.getItem('vidushi_username') || 'સાહેબ';
            document.getElementById('userNameInput').value = userName;
            
            document.getElementById('status-text').textContent = '🚀 તૈયાર છું ' + userName + '!';
            
            if (!localStorage.getItem('vidushi_silent')) {
                speak('જય શ્રી કૃષ્ણ! 3D વંશાવલી તૈયાર છે 🌌');
            }
        });

        // Prevent context menu
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
