<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidushi-AI | Multi-Key Edition</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://unpkg.com/3d-force-graph"></script>
    <script src="vanshavali_data.js"></script>

    <style>
        :root { --p: #ff4500; --b: #000; }
        body, html { margin: 0; padding: 0; background: var(--b); color: white; font-family: 'Segoe UI', sans-serif; height: 100%; overflow: hidden; }
        #home-page { height: 100vh; width: 100vw; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        #vidushi-video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        .top-nav { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .mic-container { position: fixed; bottom: 40px; left: 0; width: 100%; z-index: 1000; text-align: center; pointer-events: none; }
        .mic-btn { width: 85px; height: 85px; border-radius: 50%; background: var(--p); border: 4px solid white; color: white; font-size: 32px; cursor: pointer; box-shadow: 0 0 35px var(--p); display: inline-flex; align-items: center; justify-content: center; pointer-events: auto; }
        #status-text { background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 25px; display: inline-block; margin-bottom: 15px; font-weight: bold; border: 1px solid var(--p); pointer-events: auto; max-width: 85%; }
        
        #settings-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 2000; display: none; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .setting-group { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .setting-group h4 { margin: 0 0 10px 0; color: var(--p); }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        .close-btn { background: red; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; float: right; }
    </style>
</head>
<body id="main-body">

    <div id="home-page" onclick="welcomeUser()">
        <video id="vidushi-video" autoplay loop muted playsinline><source id="v-src" src="smiling.mp4" type="video/mp4"></video>
        <div class="top-nav">
            <button class="mic-btn" style="width:50px; height:50px; font-size:20px;" onclick="event.stopPropagation(); toggleSettings();"><i class="fas fa-cog"></i></button>
        </div>
        <div class="mic-container">
            <div id="status-text">જય શ્રી કૃષ્ણ, હું વિદુષી છું</div><br>
            <button class="mic-btn" onclick="event.stopPropagation(); startVoice();"><i class="fas fa-microphone"></i></button>
        </div>
    </div>

    <div id="settings-page">
        <button class="close-btn" onclick="toggleSettings()">બંધ કરો</button>
        <h2 style="color:var(--p);">Vidushi-AI Master Settings</h2>

        <div class="setting-group">
            <h4>🤖 AI Model & Multiple Keys</h4>
            <select id="aiProvider">
                <option value="gemini">Google Gemini</option>
                <option value="groq">Groq AI</option>
            </select>
            <textarea id="apiKey" rows="2" placeholder="Gemini Keys (key1, key2, key3...)"></textarea>
            <input type="password" id="groqKey" placeholder="Groq API Key">
            <select id="groqModel">
                <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Latest)</option>
                <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
                <option value="mixtral-8x7b-32768">Mixtral 8x7b</option>
            </select>
        </div>

        <div class="setting-group">
            <h4>🔥 Firebase Configuration</h4>
            <input type="text" id="fbProjectId" placeholder="Project ID">
            <input type="text" id="fbAppId" placeholder="App ID">
            <input type="text" id="fbApiKey" placeholder="Web API Key">
            <input type="text" id="fbDbUrl" placeholder="Database URL">
        </div>

        <button onclick="saveAllSettings()" style="width:100%; background:var(--p); color:white; padding:15px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:16px;">બધી માહિતી સેવ કરો</button>
    </div>

    <script>
        let welcomed = false;

        // --- 💾 લોડ સેટિંગ્સ ---
        window.onload = () => {
            const fields = ['aiProvider', 'apiKey', 'groqKey', 'groqModel', 'fbProjectId', 'fbAppId', 'fbApiKey', 'fbDbUrl'];
            fields.forEach(f => {
                if(localStorage.getItem(f)) document.getElementById(f).value = localStorage.getItem(f);
            });
        };

        function saveAllSettings() {
            const fields = ['aiProvider', 'apiKey', 'groqKey', 'groqModel', 'fbProjectId', 'fbAppId', 'fbApiKey', 'fbDbUrl'];
            fields.forEach(f => localStorage.setItem(f, document.getElementById(f).value));
            alert("સેટિંગ્સ સફળતાપૂર્વક સાચવવામાં આવી છે!");
            toggleSettings();
        }

        // --- 🎭 એનિમેશન અને અવાજ ---
        function changeEmotion(emo) {
            const v = document.getElementById('vidushi-video');
            const s = document.getElementById('v-src');
            if(!s.src.includes(emo + ".mp4")) { s.src = emo + ".mp4"; v.load(); v.play(); }
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'gu-IN';
            utter.onstart = () => changeEmotion('talking');
            utter.onend = () => changeEmotion('smiling');
            window.speechSynthesis.speak(utter);
        }

        function welcomeUser() {
            if (!welcomed) {
                speak("જય શ્રી કૃષ્ણ! હું વિદુષી છું. મને દેવેન્દ્રભાઈએ બનાવી છે. હું આપની શું મદદ કરી શકું?");
                welcomed = true;
            }
        }

        // --- 🧠 AI LOGIC ---
        async function askAI(query) {
            const provider = localStorage.getItem('aiProvider') || 'gemini';
            changeEmotion('thinking');
            document.getElementById('status-text').innerText = "વિચારી રહી છું...";

            if (provider === 'groq') await askGroq(query);
            else await askGemini(query);
        }

        async function askGemini(query) {
            // 🗝️ Multi-Key Logic
            const rawKeys = localStorage.getItem('apiKey') || "";
            const keys = rawKeys.split(',').map(k => k.trim()).filter(k => k !== "");
            
            if(keys.length === 0) return speak("મહેરબાની કરીને Gemini API કી નાખો.");
            
            // રેન્ડમલી એક કી પસંદ કરો
            const selectedKey = keys[Math.floor(Math.random() * keys.length)];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${selectedKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "તમે વિદુષી-AI છો. દેવેન્દ્રભાઈએ તમને બનાવ્યા છે. ગુજરાતીમાં જવાબ આપો: " + query }] }] })
                });
                const data = await res.json();
                const txt = data.candidates[0].content.parts[0].text;
                finalizeResponse(txt);
            } catch (e) { 
                console.error(e);
                speak("માફ કરશો, Gemini કી માં કોઈ સમસ્યા છે. બીજી કી ટ્રાય કરો."); 
            }
        }

        async function askGroq(query) {
            const key = localStorage.getItem('groqKey');
            const model = localStorage.getItem('groqModel') || 'llama-3.3-70b-versatile';
            if(!key) return speak("Groq API કી મળી નથી.");

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: "system", content: "You are Vidushi-AI, created by Devendrabhai. Answer clearly in Gujarati." },
                            { role: "user", content: query }
                        ]
                    })
                });
                const data = await res.json();
                finalizeResponse(data.choices[0].message.content);
            } catch (e) { speak("Groq કનેક્શનમાં ભૂલ છે."); }
        }

        function finalizeResponse(txt) {
            document.getElementById('status-text').innerText = txt;
            speak(txt);
        }

        // --- 🎤 VOICE ---
        function startVoice() {
            welcomeUser();
            const rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
            rec.lang = 'gu-IN';
            rec.onresult = (e) => {
                const q = e.results[0][0].transcript;
                document.getElementById('status-text').innerText = q;
                handleLogic(q);
            };
            rec.start();
        }

        function handleLogic(q) {
            // WhatsApp / Call Logic (Same as before)
            if (q.includes("મેસેજ") || q.includes("whatsapp")) {
                let target = q.includes("નીતા") ? "9227804906" : (q.includes("શ્યામ") ? "8200026682" : null);
                if (target) {
                    let msg = q.split("કે")[1] || "કેમ છો?";
                    window.open(`https://wa.me/91${target}?text=${encodeURIComponent(msg)}`, '_blank');
                    return speak("વોટ્સએપ ખોલી રહી છું.");
                }
            }
            askAI(q);
        }

        function toggleSettings() {
            const p = document.getElementById('settings-page');
            p.style.display = (p.style.display === 'block') ? 'none' : 'block';
        }
    </script>
</body>
</html>
